<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Evolução Clínica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f8f9fa; --sucesso: #27ae60; --alto: #d32f2f; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fundo); color: #333; padding-bottom: 60px; }
        .tela { display: none; max-width: 500px; margin: 20px auto; padding: 15px; }
        .ativa { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-jornada { background: #fff; border-radius: 35px; padding: 30px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-top: 10px solid var(--dourado); text-align: center; }
        .foto-rui { width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--dourado); margin: 0 auto 15px; display: block; object-fit: cover; }
        .btn-eva { border: 1px solid #eee; background: #fff; border-radius: 8px; padding: 10px 0; font-weight: 700; color: var(--azul); font-size: 0.8rem; }
        .btn-eva.active { background: var(--azul) !important; color: white !important; }
        .btn-principal { background: var(--azul); color: white; font-weight: 700; width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.1rem; margin-top: 15px; }
        .btn-voltar { background: transparent; color: #999; border: none; font-size: 0.8rem; margin-top: 10px; text-decoration: underline; }
        .bloco { background: #f8fafc; padding: 15px; border-radius: 20px; margin-top: 15px; text-align: left; border: 1px solid #eee; }
        .btn-humor { flex: 1; border: 2px solid #eee; border-radius: 12px; background: #fff; padding: 10px; cursor: pointer; text-align: center; font-size: 0.7rem; font-weight: 700; }
        .btn-humor.active { border-color: var(--azul); background: #f0f7ff; }
        .resumo-badge { font-size: 0.65rem; font-weight: 700; color: var(--dourado); letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="tela0" class="tela ativa">
        <div class="card-jornada">
            <span class="resumo-badge" id="info-jornada">BEM-VINDO</span>
            <img src="foto_rui.jpg" class="foto-rui" alt="Rui Ribeiro" onerror="this.src='https://ui-avatars.com/api/?name=Rui+Ribeiro&background=003366&color=fff&size=150'">
            <h1 style="color: var(--azul); font-weight: 700;">MÉTODO 360</h1>
            <div class="mt-4 text-start px-3">
                <label class="fw-bold small mb-2">DATA DO REGISTRO</label>
                <input type="date" id="data-dia" class="form-control" style="border-radius: 15px; padding: 12px; font-weight: 700;">
            </div>
            <button class="btn-principal" onclick="ir(1)">INICIAR AVALIAÇÃO</button>
            <button class="btn-voltar" onclick="ir(6)">Ver Minha Evolução 📈</button>
        </div>
    </div>

    <div id="tela1" class="tela">
        <div class="card-jornada">
            <h5 class="fw-bold mb-3" style="color: var(--azul)">1. PROTOCOLO GAD-7</h5>
            <div id="form-gad" style="max-height: 400px; overflow-y: auto; padding-right: 5px;">
                <script>
                    const pGAD = ["Nervoso ou ansioso?", "Controlar preocupações?", "Preocupar-se muito?", "Dificuldade relaxar?", "Inquietude?", "Irritabilidade?", "Medo de algo ruim?"];
                    pGAD.forEach((p, i) => {
                        document.write(`<div class="bloco"><p class="small fw-bold mb-1">${i+1}. ${p}</p><select class="form-select g-in"><option value="0">0 - Nenhuma vez</option><option value="1">1 - Vários dias</option><option value="2">2 - Metade dos dias</option><option value="3">3 - Quase todos os dias</option></select></div>`);
                    });
                </script>
            </div>
            <button class="btn-principal" onclick="ir(2)">PRÓXIMO: SONO</button>
        </div>
    </div>

    <div id="tela2" class="tela">
        <div class="card-jornada">
            <h5 class="fw-bold mb-4" style="color: var(--azul)">2. QUALIDADE DO SONO</h5>
            <div class="d-flex justify-content-between gap-2">
                <div class="btn-humor" onclick="sel(this,'sono','Ótimo')">😴<br>Ótimo</div>
                <div class="btn-humor" onclick="sel(this,'sono','Médio')">😐<br>Médio</div>
                <div class="btn-humor" onclick="sel(this,'sono','Ruim')">😫<br>Ruim</div>
            </div>
            <button class="btn-principal" onclick="ir(3)">PRÓXIMO: TURNOS</button>
        </div>
    </div>

    <div id="tela3" class="tela">
        <div class="card-jornada">
            <h5 class="fw-bold mb-4" style="color: var(--azul)">3. MONITORAMENTO DIÁRIO</h5>
            <div id="turnos-box" style="max-height: 450px; overflow-y: auto;">
                <script>
                    ['Manhã', 'Tarde', 'Noite'].forEach(p => {
                        const id = p[0].toLowerCase();
                        document.write(`
                            <div class="bloco text-center">
                                <p class="fw-bold small mb-2" style="color:var(--dourado)">${p.toUpperCase()}</p>
                                <div class="eva-grid mb-3">`);
                        for(let v=0; v<=10; v++) document.write(`<button class="btn-eva" onclick="selEva(this,'${id}',${v})">${v}</button>`);
                        document.write(`</div>
                                <div class="d-flex gap-1">
                                    <div class="btn-humor py-1" onclick="sel(this,'h${id}','😊')">😊</div>
                                    <div class="btn-humor py-1" onclick="sel(this,'h${id}','😐')">😐</div>
                                    <div class="btn-humor py-1" onclick="sel(this,'h${id}','😟')">😟</div>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>
            <button class="btn-principal" onclick="salvarEDisparar()">FINALIZAR REGISTRO 🏆</button>
        </div>
    </div>

    <div id="tela6" class="tela">
        <div class="card-jornada">
            <h2 style="color: var(--azul); font-weight: 700;">EVOLUÇÃO CLÍNICA</h2>
            <p class="small text-muted mb-4">Tendência dos seus últimos registros</p>
            <div class
