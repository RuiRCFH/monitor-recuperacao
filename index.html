<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Evolução</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primario: #4A6767; --segundario: #D4AF37; --fundo: #F4F7F6; --branco: #FFFFFF; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 15px; color: #333; }
        .card { background: var(--branco); border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        
        /* PAINEL DE CICLO */
        .painel-ciclo { display: flex; justify-content: space-around; background: #EBF0F0; padding: 15px; border-radius: 20px; margin-bottom: 20px; }
        .ciclo-item { text-align: center; opacity: 0.3; transition: 0.3s; }
        .ciclo-item.check { opacity: 1; color: var(--primario); font-weight: bold; }
        .ciclo-item span { display: block; font-size: 20px; }

        .dia-badge { background: var(--segundario); color: white; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }

        .bloco { border: 1px solid #F0F0F0; border-radius: 20px; padding: 18px; margin-bottom: 15px; background: white; }
        label { display: block; font-weight: bold; margin-bottom: 12px; font-size: 14px; color: var(--primario); }

        /* SELETOR DE PERÍODO MELHORADO */
        .grid-periodos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-periodo { border: 2px solid #EEE; padding: 10px; border-radius: 12px; cursor: pointer; background: white; font-size: 11px; font-weight: bold; }
        .btn-periodo.selected { border-color: var(--primario); background: #F0F5F5; }

        .btn-opcao { flex: 1; font-size: 22px; cursor: pointer; border: 1px solid #EEE; border-radius: 12px; padding: 10px; background: white; }
        .btn-opcao.active { border-color: var(--primario); background: #F0F5F5; }

        .btn-salvar { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 18px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* TIMELINE */
        .timeline-item { border-left: 3px solid var(--segundario); padding-left: 15px; margin-bottom: 20px; position: relative; }
        .timeline-item::before { content: ''; width: 12px; height: 12px; background: var(--segundario); border-radius: 50%; position: absolute; left: -8px; top: 0; }
        .resumo-dia { background: #f9f9f9; padding: 10px; border-radius: 10px; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div id="setup" style="display:none; text-align:center; padding: 20px;">
        <h2>Início da Jornada</h2>
        <p>Selecione a data da sua primeira consulta:</p>
        <input type="date" id="data-ini" style="padding:10px; border-radius:10px; border:1px solid #ddd;">
        <button onclick="configurar()" style="margin-top:15px; padding:10px 20px; border-radius:10px; background:var(--primario); color:white; border:none;">Começar</button>
    </div>

    <div id="main-app">
        <header style="text-align: center;">
            <div id="dia-atual-badge" class="dia-badge">Dia --</div>
            <h1 style="font-size: 20px; color: var(--primario); margin: 0;">Monitor de Evolução</h1>
        </header>

        <div class="painel-ciclo">
            <div id="indicador-M" class="ciclo-item"><span>☀️</span>Manhã</div>
            <div id="indicador-T" class="ciclo-item"><span>🌤️</span>Tarde</div>
            <div id="indicador-N" class="ciclo-item"><span>🌙</span>Noite</div>
        </div>

        <canvas id="graficoDor" style="max-height: 180px; margin-bottom: 20px;"></canvas>

        <div class="bloco">
            <label>Qual período está a registar?</label>
            <div class="grid-periodos">
                <button class="btn-periodo" id="P-Manhã" onclick="selecionarP('Manhã')">☀️ Manhã</button>
                <button class="btn-periodo" id="P-Tarde" onclick="selecionarP('Tarde')">🌤️ Tarde</button>
                <button class="btn-periodo" id="P-Noite" onclick="selecionarP('Noite')">🌙 Noite</button>
            </div>
        </div>

        <div id="secao-especifica-sono" class="bloco" style="display:none; border: 2px solid var(--segundario);">
            <label>Como foi o seu sono noturno?</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-opcao" onclick="setV('sono','😫',this)">😫</button>
                <button class="btn-opcao" onclick="setV('sono','😐',this)">😐</button>
                <button class="btn-opcao" onclick="setV('sono','😴',this)">😴</button>
            </div>
        </div>

        <div class="bloco">
            <label>Intensidade da Dor (0-10): <span id="v-dor">5</span></label>
            <input type="range" id="dor-val" min="0" max="10" value="5" style="width:100%" oninput="document.getElementById('v-dor').innerText = this.value">
            
            <label style="margin-top:15px;">Humor:</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-opcao" onclick="setV('humor','🤩',this)">🤩</button>
                <button class="btn-opcao" onclick="setV('humor','😐',this)">😐</button>
                <button class="btn-opcao" onclick="setV('humor','😫',this)">😫</button>
            </div>
        </div>

        <button class="btn-salvar" onclick="confirmarESalvar()">Gravar Evolução</button>

        <div id="timeline" style="margin-top: 30px;">
            <h3 style="font-size: 14px; color: var(--primario);">Histórico de Lançamentos</h3>
        </div>
    </div>
</div>

<script>
    let temp = { periodo: '', sono: null, humor: '😐' };
    let chart = null;

    function configurar() {
        const d = document.getElementById('data-ini').value;
        if(d) { localStorage.setItem('data_inicio', d); location.reload(); }
    }

    function selecionarP(p) {
        // Verificar se já existe dado para hoje
        const hoje = new Date().toLocaleDateString('pt-PT');
        const db = JSON.parse(localStorage.getItem('monitor_v8') || "[]");
        const existe = db.find(i => i.data === hoje && i.periodo === p);
        
        if(existe && !confirm("Já registou o período da " + p + " hoje. Deseja atualizar o registo?")) return;

        temp.periodo = p;
        document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('selected'));
        document.getElementById('P-'+p).classList.add('selected');
        document.getElementById('secao-especifica-sono').style.display = (p === 'Manhã') ? 'block' : 'none';
    }

    function setV(campo, val, btn) {
        btn.parentNode.querySelectorAll('.btn-opcao').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        temp[campo] = val;
    }

    function confirmarESalvar() {
        if(!temp.periodo) return alert("Por favor, selecione o período.");
        
        const data = new Date().toLocaleDateString('pt-PT');
        const registro = {
            data,
            periodo: temp.periodo,
            dor: document.getElementById('dor-val').value,
            humor: temp.humor,
            sono: temp.periodo === 'Manhã' ? temp.sono : null,
            ts: Date.now()
        };

        let db = JSON.parse(localStorage.getItem('monitor_v8') || "[]");
        // Remove anterior se for atualização
        db = db.filter(i => !(i.data === data && i.periodo === temp.periodo));
        db.unshift(registro);
        localStorage.setItem('monitor_v8', JSON.stringify(db.slice(0, 100)));
        
        alert("Registo de " + temp.periodo + " guardado com sucesso!");
        location.reload();
    }

    function render() {
        const ini = localStorage.getItem('data_inicio');
        if(!ini) { document.getElementById('main-app').style.display='none'; document.getElementById('setup').style.display='block'; return; }
        
        const hoje = new Date().toLocaleDateString('pt-PT');
        const db = JSON.parse(localStorage.getItem('monitor_v8') || "[]");
        
        // Atualizar Badge de Dia
        const d_ini = new Date(ini);
        const d_hoje = new Date();
        const diff = Math.ceil((d_hoje - d_ini) / (1000 * 60 * 60 * 24)) || 1;
        document.getElementById('dia-atual-badge').innerText = "Dia " + diff + " da Jornada";

        // Atualizar Indicadores de Ciclo
        ['Manhã','Tarde','Noite'].forEach(p => {
            if(db.some(i => i.data === hoje && i.periodo === p)) 
                document.getElementById('indicador-'+p[0]).classList.add('check');
        });

        // Gráfico
        const ctx = document.getElementById('graficoDor').getContext('2d');
        const dadosG = [...db].reverse().slice(-10);
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dadosG.map(i => i.periodo[0]),
                datasets: [{ data: dadosG.map(i => i.dor), borderColor: '#4A6767', tension: 0.3, fill: true, backgroundColor: 'rgba(74,103,103,0.1)' }]
            },
            options: { scales: { y: { min:0, max:10 } }, plugins: { legend: { display:false } } }
        });

        // Timeline Organizada
        const timeline = document.getElementById('timeline');
        const diasUnicos = [...new Set(db.map(i => i.data))].slice(0, 7);
        
        diasUnicos.forEach(dia => {
            const logsDia = db.filter(i => i.data === dia);
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.innerHTML = `<strong>Data: ${dia}</strong>`;
            const resumo = document.createElement('div');
            resumo.className = 'resumo-dia';
            logsDia.forEach(l => {
                resumo.innerHTML += `<div>• ${l.periodo}: Dor ${l.dor} | Humor ${l.humor} ${l.sono ? '| Sono '+l.sono : ''}</div>`;
            });
            item.appendChild(resumo);
            timeline.appendChild(item);
        });
    }

    window.onload = render;
</script>
</body>
</html>
