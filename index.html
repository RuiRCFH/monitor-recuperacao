<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f8f9fa; --leve: #3498db; --moderado: #f39c12; --alto: #d32f2f; --sucesso: #27ae60; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fundo); color: #333; padding-bottom: 60px; }
        .tela { display: none; max-width: 500px; margin: 20px auto; padding: 15px; }
        .ativa { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-jornada { background: #fff; border-radius: 35px; padding: 30px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-top: 10px solid var(--dourado); text-align: center; }
        .foto-rui { width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--dourado); margin: 0 auto 15px; display: block; object-fit: cover; background: #eee; }
        .btn-eva { border: 1px solid #eee; background: #fff; border-radius: 8px; padding: 10px 0; font-weight: 700; font-size: 0.85rem; color: var(--azul); }
        .btn-eva.active { background: var(--azul) !important; color: white !important; }
        .btn-principal { background: var(--azul); color: white; font-weight: 700; width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.1rem; margin-top: 15px; }
        .btn-voltar { background: transparent; color: #999; border: none; font-size: 0.8rem; margin-top: 15px; text-decoration: underline; }
        .bloco { background: #f8fafc; padding: 15px; border-radius: 20px; margin-top: 15px; text-align: left; border: 1px solid #eee; }
        .btn-humor { flex: 1; border: 2px solid #eee; border-radius: 15px; background: #fff; padding: 10px; cursor: pointer; text-align: center; font-weight: 700; font-size: 0.7rem; }
        .btn-humor.active { border-color: var(--azul); background: #f0f7ff; }
        .jornada-contador { font-weight: 700; color: var(--dourado); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="tela0" class="tela ativa">
        <div class="card-jornada">
            <span class="jornada-contador" id="contagem-dias">CARREGANDO JORNADA...</span>
            <img src="foto_rui.jpg" class="foto-rui" alt="Rui Ribeiro" onerror="this.src='https://ui-avatars.com/api/?name=Rui+Ribeiro&background=003366&color=fff&size=150'">
            <h1 style="color: var(--azul); font-weight: 700;">MÉTODO 360</h1>
            <div class="mt-4 text-start px-3">
                <label class="fw-bold small mb-2">DATA DO REGISTRO</label>
                <input type="date" id="data-dia" class="form-control" style="border-radius: 15px; padding: 12px; font-weight: 700;">
            </div>
            <button class="btn-principal" onclick="ir(1)">INICIAR JORNADA</button>
        </div>
    </div>

    <div id="tela1" class="tela">
        <div class="card-jornada">
            <div id="tarjeta-gad" style="display:none; padding:10px; color:white; border-radius:10px; margin-bottom:15px; font-weight:700;"></div>
            <h5 class="fw-bold mb-3" style="color: var(--azul)">1. PROTOCOLO GAD-7</h5>
            <div id="form-gad" style="max-height: 400px; overflow-y: auto;">
                <script>
                    const pGAD = ["Sentir-se nervoso?", "Controlar preocupações?", "Preocupar-se muito?", "Dificuldade relaxar?", "Inquietude?", "Irritabilidade?", "Medo de algo ruim?"];
                    pGAD.forEach((p, i) => {
                        document.write(`<div class="bloco"><p class="small fw-bold mb-1">${i+1}. ${p}</p><select class="form-select g-in" onchange="calcGAD()"><option value="">Selecione...</option><option value="0">0 - Nenhuma vez</option><option value="1">1 - Vários dias</option><option value="2">2 - Metade dos dias</option><option value="3">3 - Quase todos os dias</option></select></div>`);
                    });
                </script>
            </div>
            <button class="btn-principal" onclick="validarGad()">PRÓXIMO: SONO</button>
            <button class="btn-voltar" onclick="ir(0)">Voltar</button>
        </div>
    </div>

    <div id="tela2" class="tela">
        <div class="card-jornada">
            <h5 class="fw-bold mb-4" style="color: var(--azul)">2. QUALIDADE DO SONO</h5>
            <div class="d-flex justify-content-between gap-2">
                <div class="btn-humor" onclick="sel(this,'sono','Ótimo')"><span>😴</span><br>Ótimo</div>
                <div class="btn-humor" onclick="sel(this,'sono','Médio')"><span>😐</span><br>Médio</div>
                <div class="btn-humor" onclick="sel(this,'sono','Ruim')"><span>😫</span><br>Ruim</div>
            </div>
            <button class="btn-principal" onclick="ir(3)">PRÓXIMO: MANHÃ</button>
            <button class="btn-voltar" onclick="ir(1)">Voltar</button>
        </div>
    </div>

    <div id="turnos-container"></div>

    <div id="tela6" class="tela">
        <div class="card-jornada">
            <h2 style="color: var(--sucesso); font-weight: 700;">CONCLUÍDO! 🏆</h2>
            <p class="small text-muted mb-4">Veja sua evolução de hoje:</p>
            <div class="bloco"><canvas id="graficoFinal"></canvas></div>
            <div id="alerta-box" style="display:none; background:#fff5f5; border:1px solid #ffcccc; padding:15px; border-radius:15px; margin-top:15px;">
                <p class="small fw-bold text-danger">⚠️ Alerta Clínico detectado!</p>
                <a id="link-wa" href="#" target="_blank" class="btn btn-danger w-100 fw-bold">NOTIFICAR RUI RIBEIRO</a>
            </div>
            <button class="btn-principal" style="background:var(--sucesso)" onclick="location.reload()">NOVO REGISTRO</button>
        </div>
    </div>

    <script>
        let d = { gad: 0, sono: "", hM: "", hT: "", hN: "", m: 0, t: 0, n: 0 };
        document.getElementById('data-dia').valueAsDate = new Date();

        // Lógica da Jornada (Tempo)
        if(!localStorage.getItem('data_inicio_360')) localStorage.setItem('data_inicio_360', new Date().toISOString());
        const dataInicio = new Date(localStorage.getItem('data_inicio_360'));
        const diasJornada = Math.floor((new Date() - dataInicio) / (1000 * 60 * 60 * 24)) + 1;
        document.getElementById('contagem-dias').innerText = `DIA ${diasJornada} DA SUA JORNADA`;

        // Gerar telas de turnos
        const periodos = [{n:'Manhã', id:'M'}, {n:'Tarde', id:'T'}, {n:'Noite', id:'N'}];
        let htmlTurnos = '';
        periodos.forEach((p, i) => {
            htmlTurnos += `
            <div id="tela${i+3}" class="tela">
                <div class="card-jornada">
                    <h5 class="fw-bold" style="color: var(--azul)">${i+3}. REGISTRO: ${p.n.toUpperCase()}</h5>
                    <div class="bloco text-center">
                        <p class="fw-bold small mb-2">HUMOR NO PERÍODO</p>
                        <div class="humor-box">
                            <div class="btn-humor" onclick="sel(this,'h${p.id}','Ótimo')"><span>😊</span><br>Ótimo</div>
                            <div class="btn-humor" onclick="sel(this,'h${p.id}','Médio')"><span>😐</span><br>Médio</div>
                            <div class="btn-humor" onclick="sel(this,'h${p.id}','Ruim')"><span>😟</span><br>Ruim</div>
                        </div>
                    </div>
                    <div class="bloco text-center">
                        <p class="fw-bold small mb-2">DOR EVA (0 a 10)</p>
                        <div class="eva-grid">`;
            for(let v=0; v<=10; v++) htmlTurnos += `<button class="btn-eva" onclick="selEva(this,'${p.id.toLowerCase()}',${v})">${v}</button>`;
            htmlTurnos += `</div></div>
                    <button class="btn-principal" onclick="ir(${i+4})">${i===2?'VER MEU PRÊMIO 🏆':'PRÓXIMO PERÍODO'}</button>
                    <button class="btn-voltar" onclick="ir(${i+2})">Voltar</button>
                </div>
            </div>`;
        });
        document.getElementById('turnos-container').innerHTML = htmlTurnos;

        function ir(n) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById('tela' + n).classList.add('ativa');
            if(n === 6) desenharGrafico();
        }

        function calcGAD() {
            let soma = 0;
            document.querySelectorAll('.g-in').forEach(i => { if(i.value !== "") soma += parseInt(i.value); });
            d.gad = soma;
            const t = document.getElementById('tarjeta-gad');
            t.style.display = 'block';
            if(soma < 10) { t.innerText = "Ansiedade Leve"; t.style.background = "var(--leve)"; }
            else if(soma < 15) { t.innerText = "Ansiedade Moderada"; t.style.background = "var(--moderado)"; }
            else { t.innerText = "Ansiedade Elevada"; t.style.background = "var(--alto)"; }
            checkAlerts();
        }

        function validarGad() {
            let ok = true;
            document.querySelectorAll('.g-in').forEach(i => { if(i.value === "") ok = false; });
            if(!ok) { alert("Responda ao GAD-7."); return; }
            ir(2);
        }

        function sel(btn, cat, val) {
            btn.parentElement.querySelectorAll('div').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            d[cat] = val;
        }

        function selEva(btn, turno, val) {
            btn.parentElement.querySelectorAll('.btn-eva').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            d[turno.toLowerCase()] = val;
            checkAlerts();
        }

        function checkAlerts() {
            const alerta = (d.m >= 7 || d.t >= 7 || d.n >= 7 || d.gad >= 10);
            document.getElementById('alerta-box').style.display = alerta ? 'block' : 'none';
            document.getElementById('link-wa').href = `https://wa.me/5538991717426?text=*MÉTODO 360 - ALERTA*%0ADia ${diasJornada}%0AGAD-7: ${d.gad}%0AEVA: M${d.m}|T${d.t}|N${d.n}`;
        }

        function desenharGrafico() {
            const ctx = document.getElementById('graficoFinal').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Manhã', 'Tarde', 'Noite'],
                    datasets: [{
                        label: 'Nível de Dor',
                        data
