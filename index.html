<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f4f7f6; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fundo); color: #333; }

        /* ESTILO EXATO DA SUA IMAGEM (CARD BRANCO/AZUL) */
        .main-card {
            background: #fff; border-radius: 30px; padding: 40px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-top: 50px;
            border-top: 8px solid var(--dourado); text-align: center;
        }
        .titulo-metodo { color: var(--azul); font-weight: 700; font-size: 2rem; margin-bottom: 10px; }
        
        .btn-turno-header { 
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 15px;
            background: #fff; color: var(--azul); font-weight: 700; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* BOTÕES DE EMOJI (FUNCIONALIDADE) */
        .emoji-box { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0 20px; }
        .btn-emoji { 
            flex: 1; padding: 15px 5px; border: 2px solid #f0f0f0; border-radius: 15px; 
            background: #fff; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
        }
        .btn-emoji.active { background: var(--azul); color: white; border-color: var(--azul); }

        /* GAD-7 OBRIGATÓRIO ESTILIZADO */
        .gad-card { border: 2px solid var(--dourado); border-radius: 20px; background: #fffdf9; margin-top: 30px; overflow: hidden; }
        .gad-title { background: var(--dourado); color: white; padding: 15px; font-weight: 700; }
        .gad-q { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }

        /* BOTÃO "COMEÇAR AUTOCUIDADO" DA SUA IMAGEM */
        .btn-principal {
            background: var(--azul); color: white; font-weight: 700;
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            font-size: 1.1rem; margin-top: 30px; transition: 0.3s;
        }
        .btn-principal:hover { background: #002244; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <div class="main-card">
        <h1 class="titulo-metodo">MÉTODO 360</h1>
        <p class="text-muted mb-4">Acompanhamento de Recuperação</p>

        <div class="accordion" id="accFisico">
            <div class="card border-0 mb-2">
                <button class="btn-turno-header" type="button" data-bs-toggle="collapse" data-bs-target="#c1">
                    🌅 MANHÃ <span>+</span>
                </button>
                <div id="c1" class="collapse" data-bs-parent="#accFisico">
                    <div class="emoji-box">
                        <button class="btn-emoji" onclick="selecionar(this,'m',0,'c2')">0😊</button>
                        <button class="btn-emoji" onclick="selecionar(this,'m',5,'c2')">5😐</button>
                        <button class="btn-emoji" onclick="selecionar(this,'m',10,'c2')">10😫</button>
                    </div>
                </div>
            </div>

            <div class="card border-0 mb-2">
                <button class="btn-turno-header" type="button" data-bs-toggle="collapse" data-bs-target="#c2">
                    ☀️ TARDE <span>+</span>
                </button>
                <div id="c2" class="collapse" data-bs-parent="#accFisico">
                    <div class="emoji-box">
                        <button class="btn-emoji" onclick="selecionar(this,'t',0,'c3')">0😊</button>
                        <button class="btn-emoji" onclick="selecionar(this,'t',5,'c3')">5😐</button>
                        <button class="btn-emoji" onclick="selecionar(this,'t',10,'c3')">10😫</button>
                    </div>
                </div>
            </div>

            <div class="card border-0 mb-2">
                <button class="btn-turno-header" type="button" data-bs-toggle="collapse" data-bs-target="#c3">
                    🌙 NOITE <span>+</span>
                </button>
                <div id="c3" class="collapse" data-bs-parent="#accFisico">
                    <div class="emoji-box">
                        <button class="btn-emoji" onclick="selecionar(this,'n',0,null)">0😴</button>
                        <button class="btn-emoji" onclick="selecionar(this,'n',5,null)">5😐</button>
                        <button class="btn-emoji" onclick="selecionar(this,'n',10,null)">10😫</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="gad-card">
            <div class="gad-title">📑 PROTOCOLO GAD-7</div>
            <div class="gad-q">
                <p class="small mb-1">1. Sentir-se nervoso ou muito tenso?</p>
                <select class="form-select g-check"><option value="">Escolha...</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
            </div>
            <div class="gad-q">
                <p class="small mb-1">2. Não controlar as preocupações?</p>
                <select class="form-select g-check"><option value="">Escolha...</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
            </div>
            </div>

        <button class="btn-principal" onclick="enviar()">GERAR RELATÓRIO FINAL</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let d = { m: null, t: null, n: null };

    // Abre no turno certo sozinho
    window.onload = function() {
        const h = new Date().getHours();
        let id = (h < 12) ? 'c1' : (h < 18) ? 'c2' : 'c3';
        new bootstrap.Collapse(document.getElementById(id)).show();
    };

    function selecionar(btn, turno, valor, prox) {
        btn.parentElement.querySelectorAll('.btn-emoji').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        d[turno] = valor;
        if(prox) {
            setTimeout(() => {
                new bootstrap.Collapse(document.getElementById(btn.closest('.collapse').id)).hide();
                new bootstrap.Collapse(document.getElementById(prox)).show();
            }, 400);
        }
    }

    function enviar() {
        let soma = 0; let ok = true;
        document.querySelectorAll('.g-check').forEach(s => {
            if(s.value === "") ok = false;
            soma += parseInt(s.value || 0);
        });

        if(!ok) { alert("⚠️ Responda o GAD-7 completo antes de enviar."); return; }

        let msg = `*MÉTODO 360*%0A🌅M: ${d.m??'--'}%0A☀️T: ${d.t??'--'}%0A🌙N: ${d.n??'--'}%0A📊GAD-7: ${soma}`;
        window.open(`https://wa.me/5538999128532?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
