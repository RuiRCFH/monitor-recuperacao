<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Evolução Clínica - Rui Ribeiro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primario: #002E70; /* Azul Profundo */
            --segundario: #D4AF37; /* Dourado */
            --sucesso: #008F55; /* Verde Equilíbrio */
            --fundo: #F8F9FA;
            --branco: #FFFFFF;
            --texto: #2C3E50;
        }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 15px; color: var(--texto); }
        .card { background: var(--branco); border-radius: 25px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 500px; margin: auto; border-top: 6px solid var(--segundario); }
        
        header { text-align: center; margin-bottom: 25px; }
        .logo-img { max-width: 140px; height: auto; margin-bottom: 10px; }
        .nome-p { font-size: 20px; font-weight: bold; color: var(--primario); margin: 0; }
        .subtitulo { font-size: 14px; color: var(--segundario); font-weight: 500; margin-top: 5px; }
        .dia-badge { background: var(--segundario); color: white; padding: 6px 20px; border-radius: 50px; font-size: 14px; font-weight: bold; display: inline-block; margin: 15px 0; }

        .bloco { border: 1px solid #EDEDED; border-radius: 20px; padding: 18px; margin-bottom: 15px; background: white; }
        label { display: block; font-weight: bold; margin-bottom: 12px; font-size: 14px; color: var(--primario); }

        /* GAD-7 STYLE */
        .modal-container { display: none; background: #FFF; border: 2px solid var(--segundario); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .gad-pergunta { margin-bottom: 20px; background: #FDFDFD; padding: 15px; border-radius: 12px; border: 1px solid #EEE; }
        .btn-gad { width: 100%; text-align: left; padding: 12px; border: 1px solid #DDD; border-radius: 10px; background: white; font-size: 13px; margin-bottom: 5px; cursor: pointer; }
        .btn-gad.active { background: var(--segundario); color: white; border-color: var(--segundario); font-weight: bold; }

        /* ESCALAS */
        .escala-flex { display: flex; justify-content: space-between; gap: 8px; }
        .btn-opcao { flex: 1; font-size: 24px; cursor: pointer; border: 1px solid #EEE; border-radius: 15px; padding: 10px; background: white; transition: 0.2s; }
        .btn-opcao.active { border-color: var(--primario); background: #F0F4F8; transform: scale(1.05); }
        
        .btn-check { flex: 1; padding: 15px; border-radius: 15px; border: 2px solid #EEE; cursor: pointer; font-weight: bold; background: white; }
        .active-sim { background: #E8F5E9; border-color: var(--sucesso); color: var(--sucesso); }
        .active-nao { background: #FFEBEE; border-color: #C62828; color: #C62828; }

        .btn-salvar { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 18px; font-weight: bold; font-size: 16px; cursor: pointer; }
        #msg-concluido { display: none; text-align: center; padding: 30px; background: #E8F5E9; border-radius: 20px; border: 2px solid var(--sucesso); margin-bottom: 20px; }
        .timeline-card { border-left: 4px solid var(--segundario); background: #FFF; padding: 15px; margin-bottom: 15px; border-radius: 0 15px 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.03); font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <div id="setup" style="display:none; text-align:center;">
        <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'">
        <h2 style="color:var(--primario);">Bem-vindo(a)</h2>
        <p style="font-size: 14px;">Inicie o acompanhamento clínico com o <strong>Dr. Rui Ribeiro</strong>.</p>
        <p style="font-size: 12px; color: #777;">Escolha a data da sua primeira consulta:</p>
        <input type="date" id="data-ini" style="padding:15px; border-radius:12px; border:2px solid var(--segundario); width:85%; margin-bottom:20px; font-size:16px;">
        <button onclick="configurar()" class="btn-salvar">Ativar Monitor</button>
    </div>

    <div id="main-app">
        <header>
            <div id="display-dia" class="dia-badge">Dia --</div>
            <img src="logo.png" class="logo-img" alt="Logo" style="display:block; margin: 0 auto 10px auto;" onerror="this.style.display='none'">
            <p class="nome-p">Rui Ribeiro</p>
            <p class="subtitulo">Monitor de Evolução Holística</p>
        </header>

        <div id="modal-gad7" class="modal-container">
            <h2 style="color:var(--segundario); font-size:18px; margin-top:0;">📋 Avaliação GAD-7</h2>
            <p style="font-size:11px; margin-bottom:15px;">Frequência de sintomas nas últimas 2 semanas:</p>
            <div id="gad-container"></div>
            <button onclick="salvarGAD7()" class="btn-salvar" style="background:var(--segundario); margin-top:10px;">Gravar Avaliação Semanal</button>
        </div>

        <div id="conteudo-app">
            <canvas id="graficoDor" style="max-height: 160px; margin-bottom: 20px;"></canvas>

            <div id="msg-concluido">
                <span style="font-size: 40px;">✨</span>
                <h3>Ciclo de Hoje Completo!</h3>
                <p id="txt-proximo-dia" style="font-size:13px; color:#666;"></p>
            </div>

            <div id="formulario-diario">
                <div class="bloco">
                    <label>Período do Registo:</label>
                    <div class="escala-flex">
                        <button class="btn-opcao" id="btn-M" onclick="selP('Manhã')">☀️<br><small style="font-size:10px">Manhã</small></button>
                        <button class="btn-opcao" id="btn-T" onclick="selP('Tarde')">🌤️<br><small style="font-size:10px">Tarde</small></button>
                        <button class="btn-opcao" id="btn-N" onclick="selP('Noite')">🌙<br><small style="font-size:10px">Noite</small></button>
                    </div>
                </div>

                <div id="bloco-sono" class="bloco" style="display:none;
