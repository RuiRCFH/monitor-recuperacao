<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Evolução</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --principal: #4A6767; --destaque: #D4AF37; --fundo: #FDFDFD; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 15px; color: #333; }
        .card { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        
        /* CONFIGURAÇÃO INICIAL */
        #config-inicial { background: #F0F5F5; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed var(--principal); }
        
        .dia-jornada { font-size: 12px; font-weight: bold; color: var(--destaque); text-transform: uppercase; letter-spacing: 1px; }
        
        .bloco { border: 1px solid #F0F0F0; border-radius: 20px; padding: 18px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 14px; color: var(--principal); }

        .escala-flex { display: flex; justify-content: space-between; gap: 5px; }
        .btn-opcao { flex: 1; font-size: 22px; cursor: pointer; border: 1px solid #EEE; border-radius: 12px; padding: 10px; background: white; }
        .btn-opcao.active { border-color: var(--principal); background: #F0F5F5; transform: scale(1.05); }

        .btn-salvar { width: 100%; padding: 20px; background: var(--principal); color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; }
        
        .item-log { border-bottom: 1px solid #EEE; padding: 10px 0; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <header style="text-align: center; margin-bottom: 20px;">
        <span id="label-dia-jornada" class="dia-jornada">Bem-vindo à sua jornada</span>
        <h1 style="font-size: 22px; color: var(--principal); margin: 5px 0;">Monitor de Evolução</h1>
    </header>

    <div id="config-inicial" style="display:none;">
        <label>Quando iniciou o seu acompanhamento?</label>
        <input type="date" id="data-inicio-input" style="width:100%; padding:10px; border-radius:8px; border:1px solid #CCC;">
        <button onclick="definirDataInicio()" style="width:100%; margin-top:10px; padding:10px; border-radius:8px; background:var(--principal); color:white; border:none;">Definir Início da Jornada</button>
    </div>

    <canvas id="graficoEvolucao" style="margin-bottom: 20px;"></canvas>

    <div class="bloco">
        <label>Período de Avaliação:</label>
        <div class="escala-flex">
            <button class="btn-opcao" id="btn-M" onclick="setPeriodo('Manhã')">☀️</button>
            <button class="btn-opcao" id="btn-T" onclick="setPeriodo('Tarde')">🌤️</button>
            <button class="btn-opcao" id="btn-N" onclick="setPeriodo('Noite')">🌙</button>
        </div>
    </div>

    <div id="bloco-sono" class="bloco" style="display:none; border-color: var(--destaque);">
        <label>Como foi a sua noite de sono?</label>
        <div class="escala-flex">
            <button class="btn-opcao" onclick="setVal('sono', '😫', this)">😫</button>
            <button class="btn-opcao" onclick="setVal('sono', '😒', this)">😒</button>
            <button class="btn-opcao" onclick="setVal('sono', '😐', this)">😐</button>
            <button class="btn-opcao" onclick="setVal('sono', '🙂', this)">🙂</button>
            <button class="btn-opcao" onclick="setVal('sono', '😴', this)">😴</button>
        </div>
    </div>

    <div class="bloco">
        <label>Nível de Dor (EVA): <span id="v-eva">5</span></label>
        <input type="range" id="input-eva" min="0" max="10" value="5" style="width:100%" oninput="document.getElementById('v-eva').innerText = this.value">
        
        <label style="margin-top:15px;">Humor:</label>
        <div class="escala-flex">
            <button class="btn-opcao" onclick="setVal('humor', '🤩', this)">🤩</button>
            <button class="btn-opcao" onclick="setVal('humor', '😐', this)">😐</button>
            <button class="btn-opcao" onclick="setVal('humor', '😫', this)">😫</button>
        </div>
    </div>

    <button class="btn-salvar" onclick="salvar()">Gravar Dados</button>

    <div id="historico" style="margin-top:25px;"></div>
</div>

<script>
    let config = { periodo: '', sono: null, humor: '😐' };
    let chart = null;

    function definirDataInicio() {
        const data = document.getElementById('data-inicio-input').value;
        if(data) {
            localStorage.setItem('rui_data_inicio', data);
            location.reload();
        }
    }

    function calcularDiaJornada() {
        const inicio = localStorage.getItem('rui_data_inicio');
        if(!inicio) {
            document.getElementById('config-inicial').style.display = 'block';
            return "--";
        }
        const diffTime = Math.abs(new Date() - new Date(inicio));
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('label-dia-jornada').innerText = "Dia " + diffDays + " da Jornada";
        return diffDays;
    }

    function setPeriodo(p) {
        config.periodo = p;
        document.querySelectorAll('.btn-opcao').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + p[0]).classList.add('active');
        document.getElementById('bloco-sono').style.display = (p === 'Manhã') ? 'block' : 'none';
    }

    function setVal(campo, valor, btn) {
        btn.parentNode.querySelectorAll('.btn-opcao').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        config[campo] = valor;
    }

    function salvar() {
        if(!config.periodo) return alert("Selecione o período (Manhã, Tarde ou Noite)");
        
        const registro = {
            data: new Date().toLocaleDateString('pt-PT'),
            periodo: config.periodo,
            eva: document.getElementById('input-eva').value,
            humor: config.humor,
            sono: config.sono,
            diaJornada: calcularDiaJornada(),
            ts: Date.now()
        };

        let db = JSON.parse(localStorage.getItem('monitor_v7') || "[]");
        db.unshift(registro);
        localStorage.setItem('monitor_v7', JSON.stringify(db.slice(0, 180))); // Grava 6 meses
        
        alert("Registo concluído!");
        location.reload();
    }

    function render() {
        calcularDiaJornada();
        const db = JSON.parse(localStorage.getItem('monitor_v7') || "[]");
        const dadosGrafico = [...db].reverse();

        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dadosGrafico.map(i => "Dia " + i.diaJornada),
                datasets: [{ 
                    label: 'Dor', 
                    data: dadosGrafico.map(i => i.eva), 
                    borderColor: '#4A6767', 
                    backgroundColor: 'rgba(74, 103, 103, 0.1)',
                    fill: true,
                    tension: 0.3 
                }]
            },
            options: { scales: { y: { min:0, max:10 } }, plugins: { legend: { display: false } } }
        });

        const hist = document.getElementById('historico');
        db.slice(0, 5).forEach(i => {
            hist.innerHTML += `<div class="item-log">
                <strong>Dia ${i.diaJornada} (${i.data})</strong> - ${i.periodo}<br>
                Dor: ${i.eva}/10 | Humor: ${i.humor} ${i.sono ? "| Sono: " + i.sono : ""}
            </div>`;
        });
    }

    window.onload = render;
</script>
</body>
</html>
