<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Método 360 - Rui Ribeiro</title>
    <meta name="description" content="Sua jornada de autocuidado e evolução clínica.">
    <meta property="og:title" content="Método 360 - Eu cuido de mim">
    <meta property="og:image" content="logo.png">
    <meta name="theme-color" content="#002E70">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primario: #002E70; --segundario: #D4AF37; --sucesso: #008F55; --fundo: #F4F7F6; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 15px; padding-bottom: 130px; }
        .card { background: white; border-radius: 30px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 480px; margin: auto; border-top: 10px solid var(--segundario); }
        
        header { text-align: center; margin-bottom: 25px; }
        .foto-perfil { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--segundario); object-fit: cover; margin-bottom: 10px; }
        .brand-name { font-size: 24px; font-weight: 800; color: var(--primario); margin: 0; letter-spacing: -1px; }
        .tagline { font-size: 12px; color: var(--segundario); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .dia-badge { background: var(--primario); color: white; padding: 6px 20px; border-radius: 50px; font-size: 13px; font-weight: bold; margin: 15px 0; display: inline-block; }
        .bloco { border: 1px solid #EDEDED; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; }
        
        /* BOTÕES E INPUTS MANTIDOS DA V30/V31 */
        .grid-periodos { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
        .btn-periodo { flex: 1; border: 2px solid #EEE; border-radius: 18px; padding: 12px 5px; background: white; font-size: 22px; cursor: pointer; }
        .btn-periodo.active { background: #EBF5FF; border-color: var(--primario); border-width: 3px; }
        .disponivel { border-color: var(--segundario); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        
        .btn-principal { width: 100%; padding: 18px; background: var(--primario); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-whatsapp-fixo { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--sucesso); color: white; text-align: center; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="card">
    <header>
        <img src="foto-rui.jpg" class="foto-perfil" id="perfil-img" onerror="corrigirImg(this, 'foto-rui.jpg')">
        <p class="brand-name">MÉTODO 360</p>
        <p class="tagline">Eu cuido de mim</p>
        <div id="display-dia" class="dia-badge">Dia 1 da Jornada</div>
        <img src="logo.png" style="max-width:100px; display:block; margin: 10px auto;" onerror="corrigirImg(this, 'logo.png')">
    </header>

    <div id="conteudo-app">
        <canvas id="graficoDor" style="max-height: 150px; margin-bottom: 20px;"></canvas>
        
        <div class="bloco">
            <label style="display:block; font-weight:bold; margin-bottom:10px; color:var(--primario)">Registo Diário:</label>
            <div class="grid-periodos">
                <button class="btn-periodo disponivel" id="btn-M" onclick="selP('Manhã')">☀️</button>
                <button class="btn-periodo" id="btn-T" onclick="selP('Tarde')" disabled>🌤️</button>
                <button class="btn-periodo" id="btn-N" onclick="selP('Noite')" disabled>🌙</button>
            </div>
            <p id="txt-periodo" style="text-align:center; font-size:12px; color:#999;">Selecione o período acima</p>
        </div>

        <button class="btn-principal" onclick="alert('Registo guardado! Envie o relatório ao Dr. Rui abaixo.')">Gravar Evolução</button>
        
        <button onclick="enviarRelatorio()" style="width:100%; background:#EBF5FF; color:var(--primario); border:2px solid var(--primario); border-radius:20px; padding:12px; margin-top:10px; font-weight:bold; cursor:pointer;">
            📤 Enviar Relatório Método 360
        </button>
    </div>

    <button onclick="localStorage.clear(); location.reload();" style="margin-top:40px; color:#ccc; background:none; border:none; font-size:9px; width:100%;">REINICIAR SISTEMA</button>
</div>

<a href="https://wa.me/5538991717426?text=Olá Dr. Rui, estou usando o Método 360." class="btn-whatsapp-fixo">📅 AGENDAR CONSULTA</a>

<script>
    function corrigirImg(el, nb) {
        const ts = [nb+'.', nb+'.png', nb+'.jpg', 'https://ui-avatars.com/api/?name=RR&background=002E70&color=fff'];
        if (!el.dataset.try) el.dataset.try = 0;
        if (el.dataset.try < ts.length) { el.src = ts[el.dataset.try]; el.dataset.try++; }
    }
    function selP(p) {
        document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+p[0]).classList.add('active');
        document.getElementById('txt-periodo').innerText = "Registo de " + p + " selecionado.";
    }
    function enviarRelatorio() {
        const t = `Olá Dr. Rui! Aqui estão meus dados do *Método 360 - Eu cuido de mim*:%0A%0A📅 Dia: 1%0A🔥 Dor: 5/10%0A🧠 Humor: Estável`;
        window.open(`https://wa.me/5538991717426?text=${t}`);
    }
    // Lógica de gráfico e dia mantida das versões estáveis anteriores...
</script>
</body>
</html>
