<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Clínico - Rui</title>
    <style>
        :root { --clinico: #2C3E50; --suave: #F0F4F8; --acao: #2980B9; --aviso: #E74C3C; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--suave); margin: 0; padding: 15px; color: var(--clinico); }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 480px; margin: auto; }
        h2 { font-size: 18px; text-align: center; color: var(--acao); margin-top: 0; }
        
        .secao-bloco { margin-bottom: 20px; padding: 15px; border: 1px solid #E2E8F0; border-radius: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }

        /* ESCALA EVA */
        input[type=range] { width: 100%; cursor: pointer; }
        .eva-labels { display: flex; justify-content: space-between; font-size: 11px; color: #7F8C8D; }

        /* HUMOR */
        .humor-grid { display: flex; justify-content: space-between; margin-top: 10px; }
        .humor-btn { font-size: 24px; cursor: pointer; border: 2px solid #EEE; border-radius: 10px; padding: 5px; background: white; transition: 0.2s; }
        .humor-btn.selecionado { border-color: var(--acao); background: #E1EFFE; }

        /* MEDICAMENTOS */
        .med-input { width: 100%; padding: 10px; border: 1px solid #CCC; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 14px; }

        .btn-salvar { width: 100%; padding: 18px; background: var(--acao); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* RELATÓRIO */
        .historico { margin-top: 25px; background: #F8FAFC; padding: 15px; border-radius: 12px; }
        .log-item { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; border-left: 4px solid var(--acao); }
        .tag-sos { background: #FDEDEC; color: #C0392B; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registo de Evolução</h2>

    <div class="secao-bloco">
        <label>Intensidade da Dor (EVA): <span id="v-eva" style="color:var(--acao)">5</span></label>
        <input type="range" id="eva" min="0" max="10" value="5" oninput="document.getElementById('v-eva').innerText = this.value">
        <div class="eva-labels"><span>0 - Sem Dor</span><span>10 - Máxima</span></div>
    </div>

    <div class="secao-bloco">
        <label>Humor Predominante:</label>
        <div class="humor-grid">
            <button class="humor-btn" onclick="selHumor(this, 'Radiante')">🤩</button>
            <button class="humor-btn" onclick="selHumor(this, 'Bem')">🙂</button>
            <button class="humor-btn" onclick="selHumor(this, 'Neutro')">😐</button>
            <button class="humor-btn" onclick="selHumor(this, 'Baixo')">😔</button>
            <button class="humor-btn" onclick="selHumor(this, 'Crítico')">😫</button>
        </div>
    </div>

    <div class="secao-bloco" style="background: #FFFBF0;">
        <label>💊 Controlo Medicamentoso:</label>
        <div class="checkbox-group">
            <input type="checkbox" id="med_regular">
            <span>Tomou a medicação de rotina?</span>
        </div>
        <div style="margin-top:12px;">
            <label style="font-size:12px; color:#7F8C8D;">Tomou algum medicamento SOS (Extra)?</label>
            <input type="text" id="med_sos" class="med-input" placeholder="Ex: Paracetamol, Ibuprofeno...">
        </div>
    </div>

    <button class="btn-salvar" onclick="salvar()">Gravar Dados de Hoje</button>

    <div class="historico">
        <h3 style="font-size:14px; margin-top:0;">Relatório Semanal para o Rui:</h3>
        <div id="lista"></div>
    </div>
</div>

<script>
    let humor = "Neutro";

    function selHumor(btn, v) {
        document.querySelectorAll('.humor-btn').forEach(b => b.classList.remove('selecionado'));
        btn.classList.add('selecionado');
        humor = v;
    }

    function salvar() {
        const dados = {
            data: new Date().toLocaleDateString('pt-PT'),
            eva: document.getElementById('eva').value,
            humor: humor,
            regular: document.getElementById('med_regular').checked ? "Sim" : "Não",
            sos: document.getElementById('med_sos').value || "Nenhum"
        };
        
        let lista = JSON.parse(localStorage.getItem('rui_monitor') || "[]");
        lista = lista.filter(i => i.data !== dados.data);
        lista.unshift(dados);
        localStorage.setItem('rui_monitor', JSON.stringify(lista.slice(0, 7)));
        
        alert("Registo diário concluído!");
        render();
    }

    function render() {
        const lista = JSON.parse(localStorage.getItem('rui_monitor') || "[]");
        const div = document.getElementById('lista');
        div.innerHTML = lista.length ? "" : "Sem registos.";
        
        lista.forEach(i => {
            div.innerHTML += `
                <div class="log-item">
                    <strong>${i.data}</strong> — Dor: ${i.eva}/10 — ${i.humor}<br>
                    <small>Rotina: ${i.regular} | SOS: ${i.sos !== "Nenhum" ? `<span class="tag-sos">${i.sos}</span>` : 'Nenhum'}</small>
                </div>
            `;
        });
    }

    window.onload = render;
</script>
</body>
</html>
