<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Rui Ribeiro - Equilíbrio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primario: #002E70; --segundario: #D4AF37; --sucesso: #008F55; 
            --alerta: #C0392B; --fundo: #F4F7F6; --branco: #FFFFFF;
        }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 10px; color: #333; padding-bottom: 110px; }
        .card { background: var(--branco); border-radius: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border-top: 8px solid var(--segundario); }
        
        header { text-align: center; margin-bottom: 20px; }
        .foto-perfil { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--segundario); object-fit: cover; margin-bottom: 10px; background: #EEE; }
        .dia-badge { background: var(--segundario); color: white; padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }

        .bloco { border: 1px solid #EDEDED; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; }
        label { display: block; font-weight: bold; margin-bottom: 15px; font-size: 15px; color: var(--primario); }

        /* GRID SEQUENCIAL */
        .grid-periodos { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .btn-periodo { flex: 1; border: 2px solid #EEE; border-radius: 20px; padding: 15px 5px; background: white; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .btn-periodo small { display: block; font-size: 10px; font-weight: bold; color: #999; margin-top: 5px; }
        .btn-periodo:disabled { opacity: 0.1; cursor: not-allowed; }
        .disponivel { border-color: var(--segundario); border-width: 2px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0px rgba(212, 175, 55, 0); } }
        .btn-periodo.active { background: #EBF5FF; border-color: var(--primario); border-width: 3px; }

        /* GAD-7 EXPLICATIVO */
        .btn-gad-long { width: 100%; text-align: left; padding: 14px; border: 1px solid #DDD; border-radius: 12px; background: white; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .btn-gad-long.active { background: var(--segundario); color: white; font-weight: bold; border-color: var(--segundario); }

        .escala-humor { display: flex; justify-content: space-between; gap: 8px; }
        .btn-humor { flex: 1; font-size: 26px; padding: 12px; border: 2px solid #EEE; border-radius: 18px; background: white; cursor: pointer; }
        .btn-humor.active { border-color: var(--primario); background: #F0F4F8; }

        .btn-principal { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 17px; cursor: pointer; }
        
        .btn-reset-alerta { width: 100%; padding: 15px; background: white; color: var(--alerta); border: 2px solid var(--alerta); border-radius: 15px; font-weight: bold; font-size: 11px; cursor: pointer; margin-top: 50px; }

        .btn-whatsapp-fixo { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--sucesso); color: white; text-align: center; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="card">
    <div id="setup" style="display:none; text-align:center;">
        <img src="foto-rui.jpg" class="foto-perfil" alt="Rui Ribeiro" onerror="this.src='https://ui-avatars.com/api/?name=Rui+Ribeiro&background=002E70&color=fff'">
        <h2 style="color:var(--primario); margin-top:10px;">Olá, sou o Rui Ribeiro</h2>
        <p style="font-size:14px; color:#666;">Seja bem-vindo ao seu monitoramento clínico.</p>
        <div class="bloco" style="margin-top:20px;">
            <label>Escolha a data da 1ª consulta:</label>
            <input type="date" id="data-ini" style="padding:15px; border-radius:15px; border:2px solid var(--segundario); width:90%; font-size:18px;">
        </div>
        <button onclick="configurar()" class="btn-principal">Começar Jornada</button>
    </div>

    <div id="main-app">
        <header>
            <div id="display-dia" class="dia-badge">Calculando dia...</div>
            <img src="foto-rui.jpg" class="foto-perfil" alt="Rui Ribeiro" onerror="this.src='https://ui-avatars.com/api/?name=RR&background=002E70&color=fff'">
            <p style="font-weight: bold; color: var(--primario); margin:0; font-size:20px;">Rui Ribeiro</p>
            <img src="logo.png" style="max-width:100px; margin-top:10px;" onerror="this.style.display='none'">
        </header>

        <div id="box-alerta" style="display:none; background:#FFF5F5; border:2px solid var(--alerta); border-radius:20px; padding:15px; margin-bottom:20px; border-left:10px solid var(--alerta);">
            <h3 style="color:var(--alerta); margin:0; font-size:16px;">⚠️ Sugestão de Apoio</h3>
            <p id="txt-alerta" style="font-size:13px; margin:10px 0; color:#333;"></p>
        </div>

        <div id="modal-gad7" style="display:none; background:#FFF; border:3px solid var(--segundario); border-radius:25px; padding:20px; margin-bottom:20px;">
            <h2 style="color:var(--segundario); font-size:18px; margin-top:0;">📋 Avaliação Semanal</h2>
            <p style="font-size:12px; color:#666; margin-bottom:20px;">Nas últimas 2 semanas, com que frequência sentiu:</p>
            <div id="gad-container"></div>
            <button onclick="salvarGAD7()" class="btn-principal" style="background:var(--segundario); margin-top:15px;">Concluir Avaliação</button>
        </div>

        <div id="conteudo-app">
            <canvas id="graficoDor" style="max-height: 150px; margin-bottom: 25px;"></canvas>

            <div id="formulario-diario">
                <div class="bloco">
                    <label>Escolha o período do registro:</label>
                    <div class="grid-periodos">
                        <button class="btn-periodo" id="btn-M" onclick="selP('Manhã')">☀️<small>Manhã</small></button>
                        <button class="btn-periodo" id="btn-T" onclick="selP('Tarde')" disabled>🌤️<small>Tarde</small></button>
                        <button class="btn-periodo" id="btn-N" onclick="selP('Noite')" disabled>🌙<small>Noite</small></button>
                    </div>
                </div>

                <div id="bloco-sono" class="bloco" style="display:none; border:2px solid var(--segundario);">
                    <label>Qualidade do seu sono:</label>
                    <div class="escala-humor">
                        <button class="btn-humor" onclick="setV('sono','😫',this)">😫</button>
                        <button class="btn-humor" onclick="setV('sono','😐',this)">😐</button>
                        <button class="btn-humor" onclick="setV('sono','😴',this)">😴</button>
                    </div>
                </div>

                <div class="bloco">
                    <label>Nível de Dor agora (0 a 10): <span id="v-dor" style="color:var(--segundario); font-size:20px;">5</span></label>
                    <input type="range" id="input-dor" min="0" max="10" value="5" style="width:100%; accent-color:var(--primario);" oninput="document.getElementById('v-dor').innerText = this.value">
                    
                    <label style="margin-top:25px;">Seu Humor atual:</label>
                    <div class="escala-humor">
                        <button class="btn-humor" onclick="setV('humor','🤩',this)">🤩</button>
                        <button class="btn-humor" onclick="setV('humor','😐',this)">😐</button>
                        <button class="btn-humor" onclick="setV('humor','😫',this)">😫</button>
                    </div>
                </div>

                <button class="btn-principal" onclick="salvarDiario()">Gravar Informações</button>
            </div>

            <div id="msg-concluido" style="display:none; text-align:center; padding:30px; background:#E8F5E9; border-radius:25px; border:2px solid var(--sucesso);">
                <span style="font-size:40px;">✅</span>
                <h3 style="color:var(--sucesso);">Dia Concluído!</h3>
                <p>Nos vemos amanhã para novos registros.</p>
            </div>
        </div>

        <div id="historico" style="margin-top:30px;"></div>
        <button onclick="resetar()" class="btn-reset-alerta">⚠️ REINICIAR MONITOR (APAGAR TUDO)</button>
    </div>
</div>

<a href="https://wa.me/5538991717426?text=Olá%20Rui,%20o%20monitor%20sugeriu%20que%20eu%20entrasse%20em%20contato." class="btn-whatsapp-fixo">
    <span>📅 AGENDAR CONSULTA</span>
</a>

<script>
    const GAD_QUESTOES = ["Sentir-se nervoso ou tenso","Incapaz de controlar preocupações","Preocupação excessiva","Dificuldade em relaxar","Inquietude","Irritabilidade","Medo de algo horrível"];
    let dados = { periodo: '', sono: null, humor: '😐', gad: {} };
    let chart = null;

    function configurar() {
        const d = document.getElementById('data-ini').value;
        if(d) { localStorage.setItem('v24_final_start', d); location.reload(); }
    }

    function resetar() { if(confirm("Isso apagará todos os dados. Tem certeza?")) { localStorage.clear(); location.reload(); } }
    
    function getDia() {
        const iniStr = localStorage.getItem('v24_final_start');
        if(!iniStr) return null;
        try {
            const partes = iniStr.split('-');
            const dataInicio = new Date(partes[0], partes[1]-1, partes[2]);
            const hoje = new Date();
            hoje.setHours(0,0,0,0); dataInicio.setHours(0,0,0,0);
            const diff = Math.floor((hoje - dataInicio) / (1000*60*60*24));
            return (diff >= 0) ? diff + 1 : 1;
        } catch(e) { return 1; }
    }

    function selP(p) {
        dados.periodo = p;
        document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+p[0]).classList.add('active');
        document.getElementById('bloco-sono').style.display = (p === 'Manhã') ? 'block' : 'none';
    }

    function setV(campo, val, btn) {
        btn.parentNode.querySelectorAll('.btn-humor').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        dados[campo] = val;
    }

        document.getElementById('gad-container').innerHTML = GAD_QUESTOES.map((q, i) => `
            <div style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:10px;">
                <p style="font-size:13px; font-weight:bold;">${i+1}. ${q}</p>
                <button class="btn-gad-long" id="g
