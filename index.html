<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f8f9fa; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fundo); color: #333; }

        .tela { display: none; max-width: 500px; margin: 20px auto; padding: 15px; animation: slideIn 0.4s ease; }
        .ativa { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .card-jornada { background: #fff; border-radius: 35px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 10px solid var(--dourado); text-align: center; }
        
        .logo-txt { font-weight: 700; color: var(--azul); letter-spacing: 2px; font-size: 1.6rem; margin-bottom: 5px; }
        .btn-acao { background: var(--azul); color: white; font-weight: 700; width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.1rem; margin-top: 25px; transition: 0.3s; }
        .btn-acao:hover { background: #002244; transform: scale(1.02); }

        /* ESTILO EMOJIS */
        .emoji-flex { display: flex; justify-content: space-between; gap: 8px; margin: 15px 0; }
        .btn-emoji { flex: 1; border: 2px solid #f0f0f0; border-radius: 18px; background: #fff; padding: 12px 5px; transition: 0.2s; cursor: pointer; }
        .btn-emoji span { display: block; font-size: 1.8rem; margin-bottom: 5px; }
        .btn-emoji small { font-weight: 700; font-size: 0.65rem; color: #777; text-transform: uppercase; }
        .btn-emoji.active { border-color: var(--azul); background: #eef4f9; }
        .btn-emoji.active small { color: var(--azul); }

        /* ESCALA EVA 0-10 */
        .eva-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 15px; }
        .btn-eva { 
            padding: 12px 0; border: 2px solid #f0f0f0; background: #fff; border-radius: 10px; 
            font-weight: 700; color: var(--azul); transition: 0.2s; 
        }
        .btn-eva.active { background: var(--dourado); color: white; border-color: var(--dourado); transform: scale(1.1); }
        .eva-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.7rem; font-weight: 700; color: #999; }
    </style>
</head>

            <p style="color: var(--dourado); font-size: 0.8rem; letter-spacing: 3px; font-weight: 700;">RUI RIBEIRO</p>
            <div class="mt-5 text-start">
                <label class="fw-bold small mb-2" style="color: var(--azul)">DATA DO REGISTRO</label>
                <input type="date" id="data-dia" class="form-control" style="border-radius: 15px; padding: 12px; font-weight: 700; border: 2px solid #eee;">
            </div>
            <button class="btn-acao" onclick="irPara(2)">INICIAR JORNADA</button>
        </div>
    </div>

                <div class="btn-emoji" onclick="selecionar(this, 'sono', 'Ruim')"><span>😫</span><small>Ruim</small></div>
            </div>
            <button class="btn-acao" onclick="irPara(3)">PRÓXIMO PASSO ➜</button>

        </div>
    </div>
