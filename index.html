<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>MÉTODO 360 - Rui Ribeiro</title>
    <meta name="description" content="Portal de Autocuidado: Eu cuido de mim.">
    <meta property="og:title" content="MÉTODO 360">
    <meta property="og:description" content="Acompanhamento clínico personalizado com Dr. Rui Ribeiro.">
    <meta property="og:image" content="https://ruircfh.github.io/monitor-recuperacao/logo.png">
    <meta property="og:type" content="website">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primario: #002E70; --segundario: #D4AF37; --alerta: #C0392B; --fundo: #F4F7F6; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 10px; padding-bottom: 140px; }
        .card { background: white; border-radius: 30px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 480px; margin: auto; border-top: 10px solid var(--segundario); }
        
        #alerta-vermelho { display: none; background: var(--alerta); color: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: center; font-weight: bold; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        header { text-align: center; margin-bottom: 20px; }
        .foto-perfil { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--segundario); object-fit: cover; }
        .bloco { border: 1px solid #EDEDED; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; }
        .btn-principal { width: 100%; padding: 18px; background: var(--primario); color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div id="alerta-vermelho">
        ⚠️ NÍVEL CRÍTICO DETETADO!<br>
        <a href="#" id="btn-urgente-link" style="color:white; text-decoration:underline; display:block; margin-top:10px;">CLIQUE AQUI PARA FALAR COMIGO AGORA</a>
    </div>

    <div id="setup" style="display:none; text-align:center;">
        <h2 style="color:var(--primario);">MÉTODO 360</h2>
        <input type="date" id="data-ini" style="padding:15px; border-radius:15px; border:2px solid var(--segundario); width:80%; margin-bottom:20px;">
        <button onclick="configurar()" class="btn-principal">Começar</button>
    </div>

    <div id="main-app">
        <header>
            <img src="foto-rui.jpg" class="foto-perfil" onerror="this.src='https://ui-avatars.com/api/?name=RR&background=002E70&color=fff'">
            <h1 style="color:var(--primario); margin:10px 0 0 0; font-size:22px;">MÉTODO 360</h1>
            <p style="color:var(--segundario); font-size:12px; font-weight:bold; margin:0;">EU CUIDO DE MIM</p>
            <div id="display-dia" style="background:var(--primario); color:white; padding:5px 15px; border-radius:20px; display:inline-block; margin-top:10px; font-size:12px;">...</div>
        </header>

        <div id="conteudo-app">
            <canvas id="graficoDor" style="max-height: 150px; margin-bottom: 20px;"></canvas>
            
            <div class="bloco">
                <label style="display:block; font-weight:bold; margin-bottom:10px;">Qual período?</label>
                <div style="display:flex; gap:10px;">
                    <button onclick="selP('Manhã')" class="btn-principal" style="background:#eee; color:#333;">☀️</button>
                    <button onclick="selP('Tarde')" class="btn-principal" style="background:#eee; color:#333;">🌤️</button>
                    <button onclick="selP('Noite')" class="btn-principal" style="background:#eee; color:#333;">🌙</button>
                </div>
            </div>
            
            <button onclick="enviarRelatorio()" class="btn-principal" style="background: #25D366;">📤 Enviar Dados pelo WhatsApp</button>
        </div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:30px; opacity:0.3; border:none; background:none; width:100%;">Reiniciar Sistema</button>
    </div>
</div>

<script>
    let dados = { periodo: '', dor: 5, humor: 'Estavel', gad: 0 };

    function configurar() { const d = document.getElementById('data-ini').value; if(d) { localStorage.setItem('v40_start', d); location.reload(); } }
    
    function getDia() {
        const ini = localStorage.getItem('v40_start');
        if(!ini) return null;
        const d1 = new Date(ini + 'T00:00:00');
        const d2 = new Date();
        d2.setHours(0,0,0,0);
        return Math.floor((d2 - d1)/(1000*60*60*24)) + 1;
    }

    function selP(p) { dados.periodo = p; alert("Período selecionado: " + p); }

    function enviarRelatorio() {
        // CORREÇÃO DOS EMOJIS PARA O WHATSAPP
        const msg = `*METODO 360 - RELATORIO*%0A` +
                    `-------------------------%0A` +
                    `Data: Dia ${getDia()}%0A` +
                    `Periodo: ${dados.periodo}%0A` +
                    `Dor: ${dados.dor}/10%0A` +
                    `Humor: ${dados.humor}%0A` +
                    `-------------------------`;
        window.open(`https://wa.me/5538991717426?text=${msg}`);
    }

    window.onload = function() {
        const dia = getDia();
        if(!dia) { document.getElementById('main-app').style.display='none'; document.getElementById('setup').style.display='block'; }
        else { document.getElementById('display-dia').innerText = "Dia " + dia + " da Jornada"; }
    };
</script>
</body>
</html>
