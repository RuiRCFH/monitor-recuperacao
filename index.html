<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Evolução</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primario: #4A6767; --segundario: #D4AF37; --fundo: #F4F7F6; --whatsapp: #25D366; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 15px; color: #333; }
        .card { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        
        .dia-badge { background: var(--segundario); color: white; padding: 6px 18px; border-radius: 50px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 10px; }

        .bloco { border: 1px solid #F0F0F0; border-radius: 20px; padding: 18px; margin-bottom: 15px; background: white; }
        label { display: block; font-weight: bold; margin-bottom: 12px; font-size: 14px; color: var(--primario); }

        .grid-periodos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-periodo { border: 2px solid #EEE; padding: 12px; border-radius: 12px; cursor: pointer; background: white; font-size: 11px; font-weight: bold; }
        .btn-periodo.selected { border-color: var(--primario); background: #F0F5F5; color: var(--primario); }

        .btn-opcao { flex: 1; font-size: 22px; cursor: pointer; border: 1px solid #EEE; border-radius: 12px; padding: 10px; background: white; }
        .btn-opcao.active { border-color: var(--primario); background: #F0F5F5; border-width: 2px; }

        .btn-salvar { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 18px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* BOTÕES DE EXPORTAÇÃO */
        .area-exportacao { display: flex; gap: 10px; margin-top: 20px; }
        .btn-export { flex: 1; padding: 12px; border-radius: 12px; border: none; color: white; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-whatsapp { background: var(--whatsapp); }
        .btn-download { background: var(--primario); }

        .timeline-card { border-left: 4px solid var(--segundario); background: #FFF; padding: 15px; margin-bottom: 20px; border-radius: 0 15px 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .resumo-linha { border-bottom: 1px solid #F0F0F0; padding: 8px 0; display: flex; justify-content: space-between; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <div id="setup" style="display:none; text-align:center; padding: 20px;">
        <h2 style="color:var(--primario)">Configuração Inicial</h2>
        <p>Selecione a data que deseja considerar como o <strong>Dia 1</strong>:</p>
        <input type="date" id="data-ini" style="padding:12px; border-radius:10px; border:1px solid #ddd; width:80%;">
        <br><br>
        <button onclick="configurar()" style="padding:15px 30px; border-radius:15px; background:var(--primario); color:white; border:none; font-weight:bold; cursor:pointer;">Iniciar Monitoramento</button>
    </div>

    <div id="main-app">
        <header style="text-align: center;">
            <div id="display-dia-jornada" class="dia-badge">Calculando...</div>
            <h1 style="font-size: 18px; color: var(--primario); margin: 0; opacity: 0.7;">Monitor de Evolução</h1>
        </header>

        <canvas id="graficoDor" style="max-height: 160px; margin: 20px 0;"></canvas>

        <div class="bloco">
            <label>Período do Registro:</label>
            <div class="grid-periodos">
                <button class="btn-periodo" id="btn-Manhã" onclick="selecionarP('Manhã')">☀️ Manhã</button>
                <button class="btn-periodo" id="btn-Tarde" onclick="selecionarP('Tarde')">🌤️ Tarde</button>
                <button class="btn-periodo" id="btn-Noite" onclick="selecionarP('Noite')">🌙 Noite</button>
            </div>
        </div>

        <div id="bloco-sono" class="bloco" style="display:none; border: 2px solid var(--segundario);">
            <label>Qualidade do Sono:</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-opcao" onclick="setV('sono','😫',this)">😫</button>
                <button class="btn-opcao" onclick="setV('sono','😐',this)">😐</button>
                <button class="btn-opcao" onclick="setV('sono','😴',this)">😴</button>
            </div>
        </div>

        <div class="bloco">
            <label>Dor (0-10): <span id="label-dor">5</span></label>
            <input type="range" id="val-dor" min="0" max="10" value="5" style="width:100%" oninput="document.getElementById('label-dor').innerText = this.value">
            
            <label style="margin-top:15px;">Humor:</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-opcao" onclick="setV('humor','🤩',this)">🤩</button>
                <button class="btn-opcao" onclick="setV('humor','😐',this)">😐</button>
                <button class="btn-opcao" onclick="setV('humor','😫',this)">😫</button>
            </div>
        </div>

        <button class="btn-salvar" onclick="salvarDados()">Gravar Dados</button>

        <div class="area-exportacao">
            <button class="btn-export btn-whatsapp" onclick="enviarWhatsApp()">
                <span>📱 Enviar WhatsApp</span>
            </button>
            <button class="btn-export btn-download" onclick="baixarRelatorio()">
                <span>📥 Baixar CSV</span>
            </button>
        </div>

        <div id="timeline-container" style="margin-top: 35px;">
            <h3 style="font-size: 14px; color: var(--primario); border-bottom: 1px solid #EEE; padding-bottom: 10px;">Histórico</h3>
        </div>
        
        <button onclick="resetar()" style="margin-top:30px; background:none; border:none; color:#CCC; font-size:10px; width:100%; cursor:pointer;">Reiniciar Aplicativo</button>
    </div>
</div>

<script>
    let atual = { periodo: '', sono: null, humor: '😐' };
    let chartObj = null;

    function configurar() {
        const val = document.getElementById('data-ini').value;
        if(val) {
            localStorage.setItem('data_inicio_v11', val);
            location.reload();
        }
    }

    function resetar() {
        if(confirm("Deseja apagar todos os dados?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function getDiaJornada() {
        const dataSalva = localStorage.getItem('data_inicio_v11');
        if(!dataSalva) return 1;
        const partes = dataSalva.split('-');
        const dataInicio = new Date(partes[0], partes[1] - 1, partes[2]);
        const hoje = new Date();
        const dataHoje = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
        const diffInDays = Math.floor((dataHoje - dataInicio) / (1000 * 60 * 60 * 24));
        return diffInDays + 1;
    }

    function selecionarP(p) {
        atual.periodo = p;
        document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-'+p).classList.add('selected');
        document.getElementById('bloco-sono').style.display = (p === 'Manhã') ? 'block' : 'none';
    }

    function setV(campo, val, btn) {
        btn.parentNode.querySelectorAll('.btn-opcao').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        atual[campo] = val;
    }

    function salvarDados() {
        if(!atual.periodo) return alert("Selecione o período.");
        const diaJ = getDiaJornada();
        const dataH = new Date().toLocaleDateString('pt-PT');
        
        const registro = {
            data: dataH,
            dia: diaJ,
            periodo: atual.periodo,
            dor: document.getElementById('val-dor').value,
            humor: atual.humor,
            sono: atual.periodo === 'Manhã' ? atual.sono : null
        };

        let db = JSON.parse(localStorage.getItem('logs_v11') || "[]");
        db = db.filter(i => !(i.data === dataH && i.periodo === atual.periodo));
        db.unshift(registro);
        localStorage.setItem('logs_v11', JSON.stringify(db));
        
        alert("Dados salvos no Dia " + diaJ);
        location.reload();
    }

    // --- FUNÇÕES DE EXPORTAÇÃO ---
    function enviarWhatsApp() {
        const db = JSON.parse(localStorage.getItem('logs_v11') || "[]");
        if(db.length === 0) return alert("Nenhum dado para enviar.");

        let texto = "*Relatório de Evolução Clínica*\n\n";
        db.slice(0, 15).forEach(i => {
            texto += `📅 *Dia ${i.dia}* (${i.data}) - ${i.periodo}\n`;
            texto += `🔹 Dor: ${i.dor}/10 | Humor: ${i.humor} ${i.sono ? '| Sono: '+i.sono : ''}\n`;
            texto += `------------------\n`;
        });

        const url = "https://wa.me/?text=" + encodeURIComponent(texto);
        window.open(url, '_blank');
    }

    function baixarRelatorio() {
        const db = JSON.parse(localStorage.getItem('logs_v11') || "[]");
        if(db.length === 0) return alert("Nenhum dado para baixar.");

        let csv = "Data,Dia,Periodo,Dor,Humor,Sono\n";
        db.forEach(i => {
            csv += `${i.data},${i.dia},${i.periodo},${i.dor},${i.humor},${i.sono || '-'}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "relatorio_evolucao_rui.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function renderizar() {
        const dataIni = localStorage.getItem('data_inicio_v11');
        if(!dataIni) {
            document.getElementById('main-app').style.display='none';
            document.getElementById('setup').style.display='block';
            return;
        }
        
        document.getElementById('display-dia-jornada').innerText = "Dia " + getDiaJornada() + " da Jornada";
        const db = JSON.parse(localStorage.getItem('logs_v11') || "[]");

        // Gráfico
        const ctx = document.getElementById('graficoDor').getContext('2d');
        const ultimos = [...db].reverse().slice(-10);
        if(chartObj) chartObj.destroy();
        chartObj = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ultimos.map(i => "D" + i.dia + " " + i.periodo[0]),
                datasets: [{ data: ultimos.map(i => i.dor), borderColor: '#4A6767', tension: 0.3, fill: true, backgroundColor: 'rgba(74,103,103,0.1)' }]
            },
            options: { scales: { y: { min:0, max:10 } }, plugins: { legend: { display:false } } }
        });

        // Timeline
        const container = document.getElementById('timeline-container');
        const diasUnicos = [...new Set(db.map(i => i.dia))].sort((a,b) => b-a);
        diasUnicos.forEach(dNum => {
            const logsD = db.filter(i => i.dia === dNum);
            const card = document.createElement('div');
            card.className = 'timeline-card';
            card.innerHTML = `<div style="font-weight:bold; color:var(--segundario);">DIA ${dNum} <small style="color:#999;">(${logsD[0].data})</small></div>`;
            logsD.forEach(l => {
                card.innerHTML += `<div class="resumo-linha"><span><strong>${l.periodo}</strong></span><span>Dor: ${l.dor} | Humor: ${l.humor} ${l.sono ? '| Sono: '+l.sono : ''}</span></div>`;
            });
            container.appendChild(card);
        });
    }

    window.onload = renderizar;
</script>
</body>
</html>
