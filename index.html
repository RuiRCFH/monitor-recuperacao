<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Rui Ribeiro - Equilíbrio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primario: #002E70; --segundario: #D4AF37; --sucesso: #008F55; 
            --alerta: #C0392B; --fundo: #F4F7F6;
        }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 10px; color: #333; padding-bottom: 110px; }
        .card { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border-top: 8px solid var(--segundario); }
        header { text-align: center; margin-bottom: 20px; }
        .foto-perfil { width: 105px; height: 105px; border-radius: 50%; border: 4px solid var(--segundario); object-fit: cover; margin-bottom: 10px; background: #EEE; }
        .dia-badge { background: var(--segundario); color: white; padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .bloco { border: 1px solid #EDEDED; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; }
        label { display: block; font-weight: bold; margin-bottom: 15px; font-size: 15px; color: var(--primario); }
        .btn-principal { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 17px; cursor: pointer; }
        .btn-whatsapp-fixo { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--sucesso); color: white; text-align: center; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="card">
    <div id="main-app">
        <header>
            <div id="display-dia" class="dia-badge">Calculando...</div>
            <img src="foto-rui.jpg" class="foto-perfil" alt="Rui Ribeiro" id="perfil-img" onerror="corrigirFoto(this)">
            <p style="font-weight: bold; color: var(--primario); margin:0; font-size:20px;">Rui Ribeiro</p>
            <img src="logo.png" id="logo-img" style="max-width:120px; margin-top:10px;" onerror="corrigirLogo(this)">
        </header>
        <div id="conteudo-app">
            <canvas id="graficoDor" style="max-height: 150px; margin-bottom: 25px;"></canvas>
            <button class="btn-principal" onclick="enviarRelatorio()">📤 Enviar Dados ao Dr. Rui</button>
        </div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:50px; color:red; background:none; border:none; font-size:10px; width:100%;">⚠️ REINICIAR MONITOR</button>
    </div>
</div>
<a href="https://wa.me/5538991717426" class="btn-whatsapp-fixo">📅 AGENDAR CONSULTA</a>
<script>
    function corrigirFoto(el) {
        const caminhos = ['foto-rui.jpg.', 'foto-rui.jpg.jpg', 'https://ui-avatars.com/api/?name=RR&background=002E70&color=fff'];
        if (!el.dataset.try) el.dataset.try = 0;
        if (el.dataset.try < caminhos.length) {
            el.src = caminhos[el.dataset.try];
            el.dataset.try++;
        }
    }
    function corrigirLogo(el) {
        const caminhos = ['logo.png.', 'logo.png.png'];
        if (!el.dataset.try) el.dataset.try = 0;
        if (el.dataset.try < caminhos.length) {
            el.src = caminhos[el.dataset.try];
            el.dataset.try++;
        } else { el.style.display = 'none'; }
    }
    window.onload = function() {
        const ini = localStorage.getItem('v28_start') || new Date().toISOString().split('T')[0];
        localStorage.setItem('v28_start', ini);
        const diff = Math.floor((new Date() - new Date(ini))/(1000*60*60*24)) + 1;
        document.getElementById('display-dia').innerText = "Dia " + diff;
    }
</script>
</body>
</html>
