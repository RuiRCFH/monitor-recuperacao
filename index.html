<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 - Rui Ribeiro</title>
    
    <meta property="og:title" content="MÉTODO 360 - Rui Ribeiro">
    <meta property="og:description" content="Eu cuido de mim: Evolução em Práticas Integrativas.">
    <meta property="og:image" content="https://ruircfh.github.io/monitor-recuperacao/logo.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primario: #002E70; --segundario: #D4AF37; --alerta: #C0392B; --fundo: #F4F7F6; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 10px; padding-bottom: 140px; }
        .card { background: white; border-radius: 30px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 480px; margin: auto; border-top: 10px solid var(--segundario); }
        
        #alerta-urgente { display: none; background: var(--alerta); color: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: center; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        header { text-align: center; margin-bottom: 25px; }
        .foto-perfil { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--segundario); object-fit: cover; margin-bottom: 10px; background: #EEE; }
        .brand-name { font-size: 24px; font-weight: 800; color: var(--primario); margin: 0; letter-spacing: -1px; }
        .tagline { font-size: 12px; color: var(--segundario); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .dia-badge { background: var(--primario); color: white; padding: 6px 20px; border-radius: 50px; font-size: 13px; font-weight: bold; margin: 15px 0; display: inline-block; }
        
        .bloco { border: 1px solid #EDEDED; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; }
        .grid-periodos { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
        .btn-periodo { flex: 1; border: 2px solid #EEE; border-radius: 18px; padding: 12px 5px; background: white; font-size: 22px; cursor: pointer; opacity: 0.3; }
        .btn-periodo.active { background: #EBF5FF; border-color: var(--primario); border-width: 3px; opacity: 1; }
        .btn-periodo.disponivel { border-color: var(--segundario); border-width: 2px; opacity: 1; animation: glow 2s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 0 0px rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0px rgba(212, 175, 55, 0); } }
        
        .btn-opcao { flex: 1; font-size: 26px; padding: 12px; border: 2px solid #EEE; border-radius: 18px; background: white; cursor: pointer; }
        .btn-opcao.active { border-color: var(--primario); background: #F0F4F8; }
        .btn-principal { width: 100%; padding: 18px; background: var(--primario); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div id="setup" style="display:none; text-align:center;">
        <h2 style="color:var(--primario);">MÉTODO 360</h2>
        <p>Início da Jornada:</p>
        <input type="date" id="data-ini" style="padding:15px; border-radius:15px; border:2px solid var(--segundario); width:80%; margin-bottom:20px;">
        <button onclick="configurar()" class="btn-principal">Começar Autocuidado</button>
    </div>

    <div id="main-app">
        <div id="alerta-urgente">
            <h3 style="margin:0;">⚠️ ATENÇÃO CRÍTICA</h3>
            <p style="font-size:12px; margin: 10px 0;">Identificámos níveis elevados de desconforto. Por favor, fale comigo.</p>
            <button onclick="falarRui('urgente')" style="background:white; color:var(--alerta); border:none; padding:10px 20px; border-radius:50px; font-weight:bold; cursor:pointer;">FALAR COM RUI RIBEIRO</button>
        </div>

        <header>
            <img src="foto-rui.jpg" class="foto-perfil" id="perfil-img" onerror="corrigirImg(this, 'foto-rui.jpg')">
            <p class="brand-name">MÉTODO 360</p>
            <p class="tagline">Eu cuido de mim</p>
            <div id="display-dia" class="dia-badge">...</div>
            <img src="logo.png" id="logo-img" style="max-width:100px; display:block; margin: 10px auto;" onerror="corrigirImg(this, 'logo.png')">
        </header>

        <div id="modal-gad7" style="display:none;" class="bloco">
            <h3 style="color:var(--segundario); margin-top:0;">📋 Avaliação de Saúde</h3>
            <div id="gad-container"></div>
            <button onclick="salvarGAD7()" class="btn-principal" style="background:var(--segundario); margin-top:15px;">Gravar Avaliação</button>
        </div>

        <div id="conteudo-app">
            <canvas id="graficoDor" style="max-height: 150px; margin-bottom: 10px;"></canvas>
            <button onclick="baixarGrafico()" style="width:100%; background:none; border:none; font-size:10px; color:#999; cursor:pointer; margin-bottom:15px;">📸 Guardar Imagem do Gráfico</button>

            <div id="formulario-diario">
                <div class="bloco">
                    <label style="display:block; font-weight:bold; margin-bottom:10px; color:var(--primario)">Período:</label>
                    <div class="grid-periodos">
                        <button class="btn-periodo" id="btn-M" onclick="selP('Manhã')" disabled>☀️</button>
                        <button class="btn-periodo" id="btn-T" onclick="selP('Tarde')" disabled>🌤️</button>
                        <button class="btn-periodo" id="btn-N" onclick="selP('Noite')" disabled>🌙</button>
                    </div>
                </div>

                <div id="bloco-sono" class="bloco" style="display:none; border: 2px solid var(--segundario);">
                    <label style="display:block; font-weight:bold; margin-bottom:10px;">Como dormiu?</label>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-opcao" onclick="setV('sono','😫',this)">😫</button>
                        <button class="btn-opcao" onclick="setV('sono','😐',this)">😐</button>
                        <button class="btn-opcao" onclick="setV('sono','😴',this)">😴</button>
                    </div>
                </div>

                <div class="bloco">
                    <label style="display:block; font-weight:bold; margin-bottom:10px;">Desconforto (0-10): <span id="v-dor" style="color:var(--segundario); font-size:20px;">5</span></label>
                    <input type="range" id="input-dor" min="0" max="10" value="5" style="width:100%" oninput="document.getElementById('v-dor').innerText = this.value">
                </div>

                <div class="bloco">
                    <label style="display:block; font-weight:bold; margin-bottom:10px;">Usou medicação SOS? 💊</label>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-opcao" style="font-size:16px;" onclick="setV('med','Sim',this)">Sim</button>
                        <button class="btn-opcao" style="font-size:16px;" onclick="setV('med','Não',this)">Não</button>
                    </div>
                </div>

                <div class="bloco">
                    <label style="display:block; font-weight:bold; margin-bottom:10px;">Humor:</label>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-opcao" onclick="setV('humor','🤩',this)">🤩</button>
                        <button class="btn-opcao" onclick="setV('humor','😐',this)">😐</button>
                        <button class="btn-opcao" onclick="setV('humor','😫',this)">😫</button>
                    </div>
                </div>

                <button class="btn-principal" onclick="salvarDiario()">Gravar Registo Método 360</button>
            </div>
            
            <button onclick="enviarRelatorio()" style="width:100%; background:#25D366; color:white; border:none; border-radius:20px; padding:18px; margin-top:15px; font-weight:bold; cursor:pointer;">📤 Enviar Dados para Rui Ribeiro</button>
        </div>

        <button onclick="if(confirm('Reiniciar jornada?')) { localStorage.clear(); location.reload(); }" style="margin-top:50px; color:#ccc; background:none; border:none; font-size:9px; width:100%; cursor:pointer;">⚠️ REINICIAR MONITOR (RESET)</button>
    </div>
</div>

<script>
    function corrigirImg(el, nb) {
        const t = [nb+'.', nb+'.png', nb+'.jpg', 'https://ui-avatars.com/api/?name=RR&background=002E70&color=fff'];
        if (!el.dataset.try) el.dataset.try = 0;
        if (el.dataset.try < t.length) { el.src = t[el.dataset.try]; el.dataset.try++; }
    }

    const GAD_QUESTOES = ["Nervosismo","Preocupação incontrolável","Preocupação excessiva","Dificuldade em relaxar","Inquietude","Irritabilidade","Medo de algo terrível"];
    let dadosAtuais = { periodo: '', humor: '😐', sono: '😐', med: 'Não', gad: 0 };
    let chart = null;

    function configurar() { const d = document.getElementById('data-ini').value; if(d) { localStorage.setItem('m360_v43_start', d); location.reload(); } }
    function getDia() { const ini = localStorage.getItem('m360_v43_start'); if(!ini) return null; const d1 = new Date(ini + 'T00:00:00'); const d2 = new Date(); d2.setHours(0,0,0,0); return Math.floor((d2 - d1)/(1000*60*60*24)) + 1; }
    
    function selP(p) { dadosAtuais.periodo = p; document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+p[0]).classList.add('active'); document.getElementById('bloco-sono').style.display = (p === 'Manhã') ? 'block' : 'none'; }
    function setV(campo, val, btn) { btn.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); dadosAtuais[campo] = val; }
    function setG(idx, pts) { for(let j=0; j<=3; j++) { const el = document.getElementById(`g${idx}-${j}`); if(el) el.classList.remove('active'); } document.getElementById(`g${idx}-${pts}`).classList.add('active'); if(!dadosAtuais.gad_res) dadosAtuais.gad_res = {}; dadosAtuais.gad_res[idx] = pts; }
    
    function carregarGAD7() {
        document.getElementById('gad-container').innerHTML = GAD_QUESTOES.map((q, i) => `
            <div style="margin-bottom:12px; border-bottom:1px solid #eee; padding-bottom:8px;">
                <p style="font-size:12px; font-weight:bold; margin-bottom:5px;">${i+1}. ${q}</p>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:4px;">
                    <button class="btn-opcao" style="font-size:11px; padding:8px;" id="g${i}-0" onclick="setG(${i},0)">0-Nunca</button>
                    <button class="btn-opcao" style="font-size:11px; padding:8px;" id="g${i}-1" onclick="setG(${i},1)">1-Poucos</button>
                    <button class="btn-opcao" style="font-size:11px; padding:8px;" id="g${i}-2" onclick="setG(${i},2)">2-Metade</button>
                    <button class="btn-opcao" style="font-size:11px; padding:8px;" id="g${i}-3" onclick="setG(${i},3)">3-Sempre</button>
                </div>
            </div>`).join('');
    }

    function salvarGAD7() {
        if(Object.keys(dadosAtuais.gad_res || {}).length < 7) return alert("Responda todas.");
        const soma = Object.values(dadosAtuais.gad_res).reduce((a,b) => a+b, 0);
        let logs = JSON.parse(localStorage.getItem('m360_v43_gad') || "[]");
        logs.unshift({ dia: getDia(), score: soma, data: new Date().toLocaleDateString() });
        localStorage.setItem('m360_v43_gad', JSON.stringify(logs));
        location.reload();
    }

    function salvarDiario() {
        if(!dadosAtuais.periodo) return alert("Selecione o período.");
        const dor = parseInt(document.getElementById('input-dor').value);
        const reg = { dia: getDia(), data: new Date().toLocaleDateString('pt-BR'), periodo: dadosAtuais.periodo, dor: dor, humor: dadosAtuais.humor, med: dadosAtuais.med, sono: dadosAtuais.periodo === 'Manhã' ? dadosAtuais.sono : null };
        let db = JSON.parse(localStorage.getItem('m360_v43_db') || "[]");
        db.unshift(reg);
        localStorage.setItem('m360_v43_db', JSON.stringify(db));
        alert("✅ Registo guardado!");
        location.reload();
    }

    function baixarGrafico() {
        const link = document.createElement('a');
        link.download = 'grafico-metodo360.png';
        link.href = document.getElementById('graficoDor').toDataURL('image/png');
        link.click();
    }

    function falarRui(tipo) {
        const db = JSON.parse(localStorage.getItem('m360_v43_db') || "[]");
        const gad = JSON.parse(localStorage.getItem('m360_v43_gad') || "[]");
        const dor = db.length > 0 ? db[0].dor : 0;
        const pts = gad.length > 0 ? gad[0].score : 0;
        const msg = `⚠️ ATENDIMENTO URGENTE - MÉTODO 360\nIdentificados níveis críticos:\n🔥 Desconforto: ${dor}/10\n🧠 GAD-7: ${pts} pts`;
        window.open(`https://wa.me/5538991717426?text=${encodeURIComponent(msg)}`);
    }

    function enviarRelatorio() {
        const db = JSON.parse(localStorage.getItem('m360_v43_db') || "[]");
        const gad = JSON.parse(localStorage.getItem('m360_v43_gad') || "[]");
        if(db.length === 0) return alert("Sem dados.");
        const u = db[0];
        const media = (db.reduce((a,b) => a + b.dor, 0) / db.length).toFixed(1);
        const t = `*MÉTODO 360 - EVOLUÇÃO*\n---------------------------\n📅 *Dia:* ${getDia()}\n🕒 *Período:* ${u.periodo}\n🔥 *Desconforto:* ${u.dor}/10\n💊 *Medicação:* ${u.med}\n🧠 *Humor:* ${u.humor}\n😴 *Sono:* ${u.sono || 'N/A'}\n---------------------------\n📊 *Média de Dor:* ${media}/10\n📋 *GAD-7:* ${gad.length > 0 ? gad[0].score : 'N/A'} pts\n---------------------------\n_Enviado para Rui Ribeiro_`;
        window.open(`https://wa.me/5538991717426?text=${encodeURIComponent(t)}`);
    }

    window.onload = function() {
        const dia = getDia();
        if(!dia) { document.getElementById('main-app').style.display='none'; document.getElementById('setup').style.display='block'; return; }
        document.getElementById('display-dia').innerText = "Dia " + dia + " da Jornada";
        const db = JSON.parse(localStorage.getItem('m360_v43_db') || "[]");
        const gad = JSON.parse(localStorage.getItem('m360_v43_gad') || "[]");
        const hoje = new Date().toLocaleDateString('pt-BR');

        const ultimaDor = db.length > 0 ? db[0].dor : 0;
        const ultimoGad = gad.length > 0 ? gad[0].score : 0;
        if (ultimaDor >= 8 || ultimoGad >= 15) { document.getElementById('alerta-urgente').style.display = 'block'; }

        if ((dia === 1 || dia % 7 === 1) && !gad.some(s => s.dia === dia)) {
            document.getElementById('modal-gad7').style.display = 'block';
            document.getElementById('conteudo-app').style.display = 'none';
            carregarGAD7(); return;
        }

        const fM = db.some(i => i.data === hoje && i.periodo === 'Manhã');
        const fT = db.some(i => i.data === hoje && i.periodo === 'Tarde');
        const bM = document.getElementById('btn-M'), bT = document.getElementById('btn-T'), bN = document.getElementById('btn-N');
        if(!fM) { bM.classList.add('disponivel'); bM.disabled = false; }
        else if(!fT) { bT.classList.add('disponivel'); bT.disabled = false; }
        else { bN.classList.add('disponivel'); bN.disabled = false; }

        const ctx = document.getElementById('graficoDor').getContext('2d');
        const ult = [...db].reverse().slice(-14);
        if(chart) chart.destroy();
        chart = new Chart(ctx, { type:'line', data:{ labels:ult.map(i=>"D"+i.dia), datasets:[{ label:'Desconforto', data:ult.map(i=>i.dor), borderColor:'#002E70', tension:0.3, fill:true, backgroundColor:'rgba(0,46,112,0.1)' }] }, options:{ scales:{y:{min:0,max:10}}}});
    }
</script>
</body>
</html>
