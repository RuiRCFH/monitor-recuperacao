<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Monitor Rui Ribeiro - Equilíbrio</title>
    <meta name="description" content="Acompanhamento diário de evolução clínica e bem-estar.">
    <meta property="og:title" content="Monitor de Evolução - Rui Ribeiro">
    <meta property="og:description" content="Portal do Paciente: Registre sua evolução diária.">
    <meta property="og:image" content="logo.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Monitor Rui">
    <meta name="theme-color" content="#002E70">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* [Mantendo os estilos da v30 para não perdermos a evolução] */
        :root { --primario: #002E70; --segundario: #D4AF37; --sucesso: #008F55; --alerta: #C0392B; --fundo: #F4F7F6; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 10px; color: #333; padding-bottom: 130px; }
        .card { background: white; border-radius: 30px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border-top: 8px solid var(--segundario); }
        
        /* Melhoria visual no gradiente do topo */
        .header-decor { width: 100%; height: 5px; background: linear-gradient(90deg, var(--primario), var(--segundario)); border-radius: 10px; margin-bottom: 20px; }
        
        /* Restante do CSS da v30 aqui... */
        header { text-align: center; margin-bottom: 20px; }
        .foto-perfil { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--segundario); object-fit: cover; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .dia-badge { background: var(--segundario); color: white; padding: 8px 25px; border-radius: 50px; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .bloco { border: 1px solid #EDEDED; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; transition: 0.3s; }
        .bloco:hover { border-color: var(--segundario); }
        .btn-periodo { flex: 1; border: 2px solid #EEE; border-radius: 20px; padding: 15px 5px; background: white; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .disponivel { border-color: var(--segundario); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); box-shadow: 0 0 15px rgba(212,175,55,0.2); } 100% { transform: scale(1); } }
        .btn-principal { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 17px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,46,112,0.3); }
        .btn-whatsapp-fixo { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; background: var(--sucesso); color: white; text-align: center; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; box-shadow: 0 10px 25px rgba(0,143,85,0.3); font-size: 16px; }
    </style>
</head>
<body>
    </body>
</html>
