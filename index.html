<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f4f7f6; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fundo); color: #333; }

        /* NAVEGAÇÃO ENTRE TELAS */
        .tela { display: none; max-width: 500px; margin: 20px auto; padding: 15px; }
        .ativa { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CARDS */
        .card-jornada { background: #fff; border-radius: 30px; padding: 35px 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 10px solid var(--dourado); text-align: center; }
        .titulo-master { color: var(--azul); font-weight: 700; font-size: 2.2rem; margin-bottom: 5px; }
        .foto-perfil { width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--dourado); margin-bottom: 15px; object-fit: cover; }

        /* BOTÕES */
        .btn-principal { background: var(--azul); color: white; font-weight: 700; width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.1rem; margin-top: 20px; }
        .btn-emoji { flex: 1; border: 2px solid #f0f0f0; border-radius: 15px; background: #fff; padding: 10px; font-size: 1.5rem; }
        .btn-emoji.active { border-color: var(--dourado); background: #fffcf0; }
        
        /* ESCALA EVA */
        .eva-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 10px; }
        .btn-eva { border: 1px solid #eee; background: #fff; border-radius: 8px; padding: 10px 0; font-weight: 700; font-size: 0.8rem; }
        .btn-eva.active { background: var(--azul); color: white; }

        /* GAD-7 */
        .gad-pergunta { text-align: left; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
        .gad-pergunta p { font-weight: 700; font-size: 0.9rem; color: var(--azul); margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="tela0" class="tela ativa">
        <div class="card-jornada">
            <h1 class="titulo-master">MÉTODO 360</h1>
            <p style="color: var(--dourado); letter-spacing: 3px; font-weight: 700;">RUI RIBEIRO</p>
            <div class="mt-5 text-start">
                <label class="fw-bold small mb-2">SELECIONE A DATA</label>
                <input type="date" id="data-input" class="form-control" style="border-radius: 15px; padding: 12px; font-weight: 700;">
            </div>
            <button class="btn-principal" onclick="ir(1)">COMEÇAR AUTO CUIDADO</button>
        </div>
    </div>

    <div id="tela1" class="tela">
        <div class="card-jornada">
            <h4 class="fw-bold mb-4" style="color: var(--azul)">Protocolo GAD-7</h4>
            <div id="gad-lista">
                <div class="gad-pergunta">
                    <p>1. Sentir-se nervoso, ansioso ou muito tenso?</p>
                    <select class="form-select g-in"><option value="">Selecione...</option><option value="0">0 - Nenhuma vez</option><option value="1">1 - Vários dias</option><option value="2">2 - Metade dos dias</option><option value="3">3 - Quase todos os dias</option></select>
                </div>
                <div class="gad-pergunta">
                    <p>2. Não ser capaz de controlar as preocupações?</p>
                    <select class="form-select g-in"><option value="">Selecione...</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
                </div>
                </div>
            <button class="btn-principal" onclick="validarGad()">PRÓXIMO PASSO</button>
        </div>
    </div>

    <div id="tela2" class="tela">
        <div class="card-jornada">
            <img src="https://via.placeholder.com/130" class="foto-perfil" alt="Rui Ribeiro"> <h5 class="fw-bold" style="color: var(--azul)">MÉTODO 360</h5>
            
            <p class="fw-bold mt-4 mb-2">Como foi a qualidade do seu sono?</p>
            <div class="d-flex justify-content-between gap-2">
                <button class="btn-emoji" onclick="sel(this,'sono','Excelente')">😴</button>
                <button class="btn-emoji" onclick="sel(this,'sono','Regular')">😐</button>
                <button class="btn-emoji" onclick="sel(this,'sono','Ruim')">😫</button>
            </div>

            <p class="fw-bold mt-4 mb-2">Tomou algum medicamento hoje?</p>
            <select class="form-select mb-4" id="med-input"><option value="Não">Não</option><option value="Sim">Sim</option></select>

            <button class="btn-principal" onclick="ir(3)">AVALIAR PERÍODOS DO DIA</button>
        </div>
    </div>

    <div id="tela3" class="tela">
        <div class="card-jornada text-start">
            <h4 class="text-center fw-bold mb-4" style="color: var(--azul)">Monitoramento Diário</h4>
            
            <div class="mb-4">
                <label class="fw-bold" style="color: var(--dourado)">🌅 MANHÃ</label>
                <p class="small mb-1">Dor (EVA 0-10):</p>
                <div class="eva-container">
                    <button class="btn-eva" onclick="selEva(this,'m',0)">0</button><button class="btn-eva" onclick="selEva(this,'m',2)">2</button><button class="btn-eva" onclick="selEva(this,'m',4)">4</button><button class="btn-eva" onclick="selEva(this,'m',6)">6</button><button class="btn-eva" onclick="selEva(this,'m',8)">8</button><button class="btn-eva" onclick="selEva(this,'m',10)">10</button>
                </div>
            </div>

            <div class="mb-4">
                <label class="fw-bold" style="color: var(--dourado)">☀️ TARDE</label>
                <p class="small mb-1">Dor (EVA 0-10):</p>
                <div class="eva-container">
                    <button class="btn-eva" onclick="selEva(this,'t',0)">0</button><button class="btn-eva" onclick="selEva(this,'t',5)">5</button><button class="btn-eva" onclick="selEva(this,'t',10)">10</button>
                </div>
            </div>

            <div class="mb-4">
                <label class="fw-bold" style="color: var(--dourado)">🌙 NOITE</label>
                <p class="small mb-1">Dor (EVA 0-10):</p>
                <div class="eva-container">
                    <button class="btn-eva" onclick="selEva(this,'n',0)">0</button><button class="btn-eva" onclick="selEva(this,'n',5)">5</button><button class="btn-eva" onclick="selEva(this,'n',10)">10</button>
                </div>
            </div>

            <button class="btn-principal" onclick="finalizar()">FINALIZAR E ENVIAR 🚀</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let dados = { m: 0, t: 0, n: 0, gad: 0, sono: "", med: "" };
        document.getElementById('data-input').valueAsDate = new Date();

        function ir(n) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById('tela' + n).classList.add('ativa');
            window.scrollTo(0,0);
        }

        function validarGad() {
            let soma = 0; let ok = true;
            document.querySelectorAll('.g-in').forEach(i => {
                if(i.value === "") ok = false;
                soma += parseInt(i.value || 0);
            });
            if(!ok) { alert("Responda todas as perguntas do GAD-7!"); return; }
            dados.gad = soma; ir(2);
        }

        function sel(btn, cat, val) {
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            dados[cat] = val;
        }

        function selEva(btn, turno, val) {
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            dados[turno] = val;
        }

        function finalizar() {
            const data = document.getElementById('data-input').value;
            const linkChart = `https://quickchart.io/chart?c={type:'line',data:{labels:['M','T','N'],datasets:[{label:'EVA',data:[${dados.m},${dados.t},${dados.n}],borderColor:'gold'}]}}`;
            let msg = `*MÉTODO 360 - ${data}*%0A📊 GAD-7: ${dados.gad}%0A😴 Sono: ${dados.sono}%0A💊 Med: ${document.getElementById('med-input').value}%0A🌅 M: ${dados.m} | ☀️ T: ${dados.t} | 🌙 N: ${dados.n}%0A📈 Gráfico: ${linkChart}`;
            window.open(`https://wa.me/5538999128532?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
