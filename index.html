<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Clínico Premium - Rui</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --clinico: #2C3E50; --suave: #F0F4F8; --acao: #2980B9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--suave); margin: 0; padding: 15px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        h2 { font-size: 18px; text-align: center; color: var(--acao); margin-top: 0; }
        .bloco { margin-bottom: 20px; padding: 15px; border: 1px solid #E2E8F0; border-radius: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 14px; }

        /* ESCALA DE SONO E HUMOR */
        .escala-visual { display: flex; justify-content: space-between; gap: 5px; }
        .btn-visual { flex: 1; font-size: 22px; cursor: pointer; border: 2px solid #EEE; border-radius: 10px; padding: 8px; background: white; transition: 0.2s; }
        .btn-visual.selected { border-color: var(--acao); background: #E1EFFE; }

        .periodo-container { display: flex; gap: 5px; margin-bottom: 15px; background: #f8f9fa; padding: 5px; border-radius: 10px; }
        .btn-periodo { flex: 1; border: none; padding: 10px; border-radius: 8px; cursor: pointer; background: none; font-weight: bold; font-size: 11px; }
        .btn-periodo.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--acao); }

        .btn-salvar { width: 100%; padding: 18px; background: var(--acao); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        canvas { margin: 20px 0; max-height: 250px; }
        .log-item { background: #F8FAFC; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; border-left: 4px solid var(--acao); }
    </style>
</head>
<body>

<div class="card">
    <h2>Monitor de Evolução Rui</h2>

    <div style="padding: 10px;">
        <canvas id="graficoDor"></canvas>
    </div>

    <div class="bloco">
        <div class="periodo-container">
            <button class="btn-periodo active" onclick="setPeriodo(this, 'Manhã')">☀️ Manhã</button>
            <button class="btn-periodo" onclick="setPeriodo(this, 'Tarde')">🌤️ Tarde</button>
            <button class="btn-periodo" onclick="setPeriodo(this, 'Noite')">🌙 Noite</button>
        </div>
        
        <label>Qualidade do Sono (Avaliar na Manhã):</label>
        <div class="escala-visual">
            <button class="btn-visual" onclick="selSono(this, '😫')">😫</button>
            <button class="btn-visual" onclick="selSono(this, '😒')">😒</button>
            <button class="btn-visual" onclick="selSono(this, '😐')">😐</button>
            <button class="btn-visual" onclick="selSono(this, '🙂')">🙂</button>
            <button class="btn-visual" onclick="selSono(this, '😴')">😴</button>
        </div>
    </div>

    <div class="bloco">
        <label>Nível de Dor (EVA): <span id="v-eva" style="color:var(--acao)">5</span></label>
        <input type="range" id="eva" min="0" max="10" value="5" style="width:100%" oninput="document.getElementById('v-eva').innerText = this.value">
        
        <label style="margin-top:15px;">Humor do Momento:</label>
        <div class="escala-visual">
            <button class="btn-visual" onclick="selHumor(this, '🤩')">🤩</button>
            <button class="btn-visual" onclick="selHumor(this, '🙂')">🙂</button>
            <button class="btn-visual" onclick="selHumor(this, '😐')">😐</button>
            <button class="btn-visual" onclick="selHumor(this, '😔')">😔</button>
            <button class="btn-visual" onclick="selHumor(this, '😫')">😫</button>
        </div>
    </div>

    <button class="btn-salvar" onclick="salvar()">Gravar Evolução</button>

    <div style="margin-top:25px;">
        <h3 style="font-size:14px; color:#7F8C8D;">Últimos Registos:</h3>
        <div id="historico"></div>
    </div>
</div>

<script>
    let periodo = "Manhã";
    let humor = "😐";
    let sono = "😐";
    let meuGrafico = null;

    function setPeriodo(btn, p) {
        periodo = p;
        document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function selHumor(btn, h) {
        document.querySelectorAll('.humor-btn, .btn-visual').forEach(b => { if(b.parentNode.innerText.includes('Humor')) b.classList.remove('selected') });
        const btns = btn.parentNode.querySelectorAll('.btn-visual');
        btns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        humor = h;
    }

    function selSono(btn, s) {
        const btns = btn.parentNode.querySelectorAll('.btn-visual');
        btns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        sono = s;
    }

    function salvar() {
        const data = new Date().toLocaleDateString('pt-PT');
        const novo = { data, periodo, eva: document.getElementById('eva').value, humor, sono, ts: Date.now() };
        
        let db = JSON.parse(localStorage.getItem('rui_monitor_v4') || "[]");
        db.unshift(novo);
        localStorage.setItem('rui_monitor_v4', JSON.stringify(db.slice(0, 21)));
        
        alert("Registo guardado!");
        renderizarTudo();
    }

    function renderizarTudo() {
        const db = JSON.parse(localStorage.getItem('rui_monitor_v4') || "[]").reverse();
        
        // Atualizar Histórico Texto
        const lista = document.getElementById('historico');
        lista.innerHTML = "";
        [...db].reverse().forEach(i => {
            lista.innerHTML += `
                <div class="log-item">
                    <strong>${i.data} (${i.periodo})</strong> — Dor: ${i.eva} | Humor: ${i.humor} | Sono: ${i.sono}
                </div>`;
        });

        // Atualizar Gráfico
        const ctx = document.getElementById('graficoDor').getContext('2d');
        if (meuGrafico) meuGrafico.destroy();
        
        const labels = db.map(i => i.data.split('/')[0] + " " + i.periodo[0]);
        const dadosDor = db.map(i => i.eva);

        meuGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Intensidade da Dor',
                    data: dadosDor,
                    borderColor: '#2980B9',
                    backgroundColor: 'rgba(41, 128, 185, 0.1)',
                    borderWidth: 3,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                scales: { y: { min: 0, max: 10 } },
                plugins: { legend: { display: false } }
            }
        });
    }

    window.onload = renderizarTudo;
</script>
</body>
</html>
