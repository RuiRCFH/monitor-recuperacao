<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f8f9fa; --alto: #d32f2f; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fundo); color: #333; padding-bottom: 60px; }

        .tela { display: none; max-width: 500px; margin: 20px auto; padding: 15px; }
        .ativa { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-jornada { background: #fff; border-radius: 35px; padding: 30px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 10px solid var(--dourado); text-align: center; }
        .foto-rui { width: 160px; height: 160px; border-radius: 50%; border: 5px solid var(--dourado); margin: 0 auto 15px; display: block; object-fit: cover; background: #eee; }

        /* ESCALA EVA 0-10 */
        .eva-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 10px; }
        .btn-eva { border: 1px solid #eee; background: #fff; border-radius: 8px; padding: 10px 0; font-weight: 700; font-size: 0.85rem; color: var(--azul); transition: 0.2s; }
        .btn-eva.active { background: var(--azul) !important; color: white !important; }

        /* BOTÕES NAVEGAÇÃO */
        .btn-principal { background: var(--azul); color: white; font-weight: 700; width: 100%; padding: 18px; border-radius: 20px; border: none; font-size: 1.1rem; margin-top: 15px; }
        .btn-voltar { background: transparent; color: #999; border: none; font-size: 0.8rem; margin-top: 15px; font-weight: 700; text-decoration: underline; }
        .btn-reset { background: #fee2e2; color: #d32f2f; border: none; padding: 5px 15px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; margin-bottom: 15px; }

        .bloco { background: #f8fafc; padding: 15px; border-radius: 20px; margin-top: 15px; text-align: left; border: 1px solid #eee; }
        .btn-humor { flex: 1; border: 2px solid #eee; border-radius: 15px; background: #fff; padding: 10px; cursor: pointer; text-align: center; }
        .btn-humor.active { border-color: var(--azul); background: #f0f7ff; }
        
        /* GRÁFICO */
        #container-grafico { display: none; margin-top: 25px; padding: 15px; background: #fff; border-radius: 20px; border: 2px solid #eee; }
        #img-grafico { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

        <div class="card-jornada">
            <button class="btn-reset" onclick="resetar()">🔄 RECOMEÇAR JORNADA</button>

            <h1 style="color: var(--azul); font-weight: 700;">MÉTODO 360</h1>
            <p style="color: var(--dourado); font-weight: 700; letter-spacing: 2px; font-size: 0.8rem;">AUTOCUIDADO PROFISSIONAL</p>
