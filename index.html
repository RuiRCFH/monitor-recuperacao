<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉTODO 360 | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; color: #333; overflow-x: hidden; }

        .tela { display: none; max-width: 500px; margin: 20px auto; padding: 20px; animation: fadeIn 0.5s; }
        .ativa { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-premium { background: #fff; border-radius: 30px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--dourado); text-align: center; }
        
        /* FOTO E LOGO */
        .foto-perfil { width: 120px; height: 120px; border-radius: 60px; border: 3px solid var(--dourado); margin-bottom: 10px; object-fit: cover; }
        .logo-small { font-weight: 700; color: var(--azul); font-size: 1.2rem; letter-spacing: 2px; }

        .btn-proximo { background: var(--azul); color: white; font-weight: 700; width: 100%; padding: 15px; border-radius: 15px; border: none; margin-top: 20px; }
        .btn-voltar { background: none; border: none; color: #777; font-size: 0.8rem; margin-top: 10px; }

        .pergunta-titulo { font-weight: 700; color: var(--azul); margin-top: 20px; margin-bottom: 15px; display: block; }
        
        /* ESCALA EVA */
        .eva-container { display: flex; justify-content: space-between; gap: 5px; }
        .eva-btn { flex: 1; padding: 10px 2px; border: 1px solid #eee; border-radius: 8px; font-size: 0.8rem; background: #f9f9f9; }
        .eva-btn.active { background: var(--azul); color: white; border-color: var(--azul); }

        .emoji-btn { font-size: 1.5rem; border: 2px solid #eee; border-radius: 15px; background: #fff; padding: 10px; width: 30%; transition: 0.2s; }
        .emoji-btn.active { border-color: var(--dourado); background: #fffcf5; }
    </style>
</head>
<body>

    <div id="tela1" class="tela ativa">
        <div class="card-premium">
            <h1 style="color: var(--azul); font-weight: 700;">MÉTODO 360</h1>
            <p class="text-muted small">INÍCIO DA JORNADA</p>
            <div class="mt-4 text-start">
                <label class="small fw-bold">DATA DA AVALIAÇÃO</label>
                <input type="date" id="data-reg" class="form-control mt-1" style="border-radius: 12px;">
            </div>
            <button class="btn-proximo" onclick="irPara(2)">COMEÇAR AUTO CUIDADO</button>
        </div>
    </div>

    <div id="tela2" class="tela">
        <div class="card-premium text-start">
            <h5 class="text-center fw-bold" style="color: var(--azul)">PROTOCOLO GAD-7</h5>
            <p class="text-center small text-muted mb-4">Últimas 2 semanas</p>
            
            <div id="gad-perguntas">
                <div class="mb-3">
                    <label class="small fw-bold">1. Sentir-se nervoso ou ansioso?</label>
                    <select class="form-select g-q"><option value="">Selecione...</option><option value="0">0 - Nenhuma vez</option><option value="1">1 - Vários dias</option><option value="2">2 - Metade dos dias</option><option value="3">3 - Quase todos os dias</option></select>
                </div>
                <div class="mb-3"><label class="small fw-bold">2. Não controlar preocupações?</label><select class="form-select g-q"><option value="">Selecione...</option><option value="0">0 - Nenhuma vez</option><option value="1">1 - Vários dias</option><option value="2">2 - Metade dos dias</option><option value="3">3 - Quase todos os dias</option></select></div>
            </div>
            <button class="btn-proximo" onclick="validarGad()">PRÓXIMO PASSO</button>
            <button class="btn-voltar" onclick="irPara(1)">Voltar</button>
        </div>
    </div>

    <div id="tela3" class="tela">
        <div class="card-premium">
            <img src="https://via.placeholder.com/120" class="foto-perfil" alt="Rui Ribeiro">
            <div class="logo-small mb-4">MÉTODO 360</div>
            
            <span class="pergunta-titulo">QUALIDADE DO SONO</span>
            <div class="d-flex justify-content-between mb-4">
                <button class="emoji-btn" onclick="selEmoji(this,'sono',0)">😴</button>
                <button class="emoji-btn" onclick="selEmoji(this,'sono',5)">😐</button>
                <button class="emoji-btn" onclick="selEmoji(this,'sono',10)">😫</button>
            </div>

            <span class="pergunta-titulo">NÍVEL DE DOR (EVA)</span>
            <div class="eva-container">
                <button class="eva-btn" onclick="selEva(this,'m')">0</button>
                <button class="eva-btn" onclick="selEva(this,'m')">3</button>
                <button class="eva-btn" onclick="selEva(this,'m')">5</button>
                <button class="eva-btn" onclick="selEva(this,'m')">7</button>
                <button class="eva-btn" onclick="selEva(this,'m')">10</button>
            </div>

            <span class="pergunta-titulo">TOMOU MEDICAMENTOS?</span>
            <select class="form-select" id="med-m"><option value="Não">Não</option><option value="Sim">Sim</option></select>

            <button class="btn-proximo" onclick="irPara(4)">SEGUIR PARA TARDE</button>
        </div>
    </div>

    <div id="tela4" class="tela">
        <div class="card-premium">
            <h4 style="color: var(--azul)">PERÍODO DA TARDE</h4>
            <span class="pergunta-titulo">DOR NA ESCALA EVA</span>
            <div class="eva-container mb-4">
                <button class="eva-btn" onclick="selEva(this,'t')">0</button>
                <button class="eva-btn" onclick="selEva(this,'t')">5</button>
                <button class="eva-btn" onclick="selEva(this,'t')">10</button>
            </div>
            <span class="pergunta-titulo">ESTADO DE HUMOR</span>
            <div class="d-flex justify-content-between">
                <button class="emoji-btn" onclick="selEmoji(this,'humorT',0)">😊</button>
                <button class="emoji-btn" onclick="selEmoji(this,'humorT',5)">😐</button>
                <button class="emoji-btn" onclick="selEmoji(this,'humorT',10)">😫</button>
            </div>
            <button class="btn-proximo" onclick="irPara(5)">SEGUIR PARA NOITE</button>
        </div>
    </div>

    <div id="tela5" class="tela">
        <div class="card-premium">
            <h4 style="color: var(--azul)">PERÍODO DA NOITE</h4>
            <span class="pergunta-titulo">DOR NA ESCALA EVA</span>
            <div class="eva-container mb-4">
                <button class="eva-btn" onclick="selEva(this,'n')">0</button>
                <button class="eva-btn" onclick="selEva(this,'n')">5</button>
                <button class="eva-btn" onclick="selEva(this,'n')">10</button>
            </div>
            <button class="btn-proximo" onclick="finalizarTudo()">GERAR MEU GRÁFICO 🚀</button>
        </div>
    </div>

    <script>
        let dados = { sono: null, dorM: 0, dorT: 0, dorN: 0, gad: 0 };

        document.getElementById('data-reg').valueAsDate = new Date();

        function irPara(n) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById('tela' + n).classList.add('ativa');
            window.scrollTo(0,0);
        }

        function selEmoji(btn, tipo, valor) {
            btn.parentElement.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            dados[tipo] = valor;
        }

        function selEva(btn, turno) {
            btn.parentElement.querySelectorAll('.eva-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(turno === 'm') dados.dorM = btn.innerText;
            if(turno === 't') dados.dorT = btn.innerText;
            if(turno === 'n') dados.dorN = btn.innerText;
        }

        function validarGad() {
            let total = 0; let ok = true;
            document.querySelectorAll('.g-q').forEach(s => {
                if(s.value === "") ok = false;
                total += parseInt(s.value || 0);
            });
            if(!ok) { alert("Responda todas as questões!"); return; }
            dados.gad = total;
            irPara(3);
        }

        function finalizarTudo() {
            const data = document.getElementById('data-reg').value;
            const linkGrafico = `https://quickchart.io/chart?c={type:'line',data:{labels:['M','T','N'],datasets:[{label:'Dor',data:[${dados.dorM},${dados.dorT},${dados.dorN}],borderColor:'gold'}]}}`;
            
            let msg = `*MÉTODO 360 - ${data}*%0A📊 GAD-7: ${dados.gad}%0A🌅 M: ${dados.dorM} | ☀️ T: ${dados.dorT} | 🌙 N: ${dados.dorN}%0A📈 Gráfico: ${linkGrafico}`;
            window.open(`https://wa.me/5538999128532?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
