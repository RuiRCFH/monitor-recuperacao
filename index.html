<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Evolução</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primario: #4A6767; --segundario: #D4AF37; --fundo: #F4F7F6; --whatsapp: #25D366; --urgente: #E74C3C; }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 15px; color: #333; }
        .card { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        
        .dia-badge { background: var(--segundario); color: white; padding: 6px 18px; border-radius: 50px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .bloco { border: 1px solid #F0F0F0; border-radius: 20px; padding: 18px; margin-bottom: 15px; background: white; }
        label { display: block; font-weight: bold; margin-bottom: 12px; font-size: 14px; color: var(--primario); }

        /* ESTILO DO QUESTIONÁRIO SEMANAL */
        #modal-semanal { display: none; background: #FFF; border: 3px solid var(--segundario); border-radius: 25px; padding: 20px; margin-bottom: 20px; animation: slideIn 0.5s ease; }
        .btn-check-semanal { width: 100%; padding: 15px; background: var(--segundario); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        .escala-flex { display: flex; justify-content: space-between; gap: 5px; }
        .btn-opcao { flex: 1; font-size: 22px; cursor: pointer; border: 1px solid #EEE; border-radius: 12px; padding: 10px; background: white; }
        .btn-opcao.active { border-color: var(--primario); background: #F0F5F5; border-width: 2px; }

        .btn-salvar { width: 100%; padding: 20px; background: var(--primario); color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; }
        .btn-export { flex: 1; padding: 12px; border-radius: 12px; border: none; color: white; font-weight: bold; font-size: 11px; cursor: pointer; }

        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="card">
    <div id="setup" style="display:none; text-align:center;">
        <h2>Bem-vindo</h2>
        <p>Inicie o seu acompanhamento escolhendo a data da 1ª consulta:</p>
        <input type="date" id="data-ini" style="padding:15px; border-radius:10px; border:1px solid #ddd; width:80%;">
        <button onclick="configurar()" class="btn-salvar" style="margin-top:20px;">Iniciar Jornada</button>
    </div>

    <div id="main-app">
        <header style="text-align: center;">
            <div id="display-dia" class="dia-badge">Dia --</div>
            <h1>Monitor de Evolução</h1>
        </header>

        <div id="modal-semanal">
            <h2 style="color:var(--segundario); font-size:18px;">📋 Avaliação de Ciclo (7 Dias)</h2>
            <p style="font-size:12px;">Como avalia o seu progresso na última semana?</p>
            
            <label>Nível de Vitalidade/Energia:</label>
            <div class="escala-flex">
                <button class="btn-opcao" onclick="setS('vitalidade', 1, this)">🪫</button>
                <button class="btn-opcao" onclick="setS('vitalidade', 3, this)">😐</button>
                <button class="btn-opcao" onclick="setS('vitalidade', 5, this)">⚡</button>
            </div>

            <label style="margin-top:15px;">Frequência da Dor nesta semana:</label>
            <div class="escala-flex">
                <button class="btn-opcao" onclick="setS('frequencia', 'Menor', this)">📉</button>
                <button class="btn-opcao" onclick="setS('frequencia', 'Igual', this)">📊</button>
                <button class="btn-opcao" onclick="setS('frequencia', 'Maior', this)">📈</button>
            </div>

            <button onclick="salvarSemanal()" class="btn-check-semanal">Finalizar Check-up Semanal</button>
        </div>

        <canvas id="graficoDor" style="max-height: 160px; margin: 20px 0;"></canvas>

        <div id="bloco-diario">
            <div class="bloco">
                <label>Período:</label>
                <div class="escala-flex">
                    <button class="btn-opcao" id="btn-Manhã" onclick="selP('Manhã')">☀️</button>
                    <button class="btn-opcao" id="btn-Tarde" onclick="selP('Tarde')">🌤️</button>
                    <button class="btn-opcao" id="btn-Noite" onclick="selP('Noite')">🌙</button>
                </div>
            </div>

            <div class="bloco">
                <label>Dor Atual (0-10): <span id="v-dor">5</span></label>
                <input type="range" id="input-dor" min="0" max="10" value="5" style="width:100%" oninput="document.getElementById('v-dor').innerText = this.value">
            </div>

            <button class="btn-salvar" onclick="salvarDiario()">Gravar Registo</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-export" style="background:var(--whatsapp)" onclick="exportarWhatsApp()">WhatsApp</button>
            <button class="btn-export" style="background:var(--primario)" onclick="exportarCSV()">Baixar CSV</button>
        </div>

        <div id="historico" style="margin-top:30px;"></div>
        <button onclick="resetar()" style="margin-top:40px; border:none; background:none; color:#ccc; font-size:10px; width:100%;">Zerar Sistema</button>
    </div>
</div>

<script>
    let temp = { periodo: '', dor: 5, semanal: {} };
    let meuGrafico = null;

    function configurar() {
        const d = document.getElementById('data-ini').value;
        if(d) { localStorage.setItem('inicio_v12', d); location.reload(); }
    }

    function resetar() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }

    function getDia() {
        const ini = new Date(localStorage.getItem('inicio_v12'));
        const hoje = new Date();
        hoje.setHours(0,0,0,0);
        ini.setHours(0,0,0,0);
        return Math.floor((hoje - ini) / (1000*60*60*24)) + 1;
    }

    function selP(p) {
        temp.periodo = p;
        document.querySelectorAll('.btn-opcao').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+p).classList.add('active');
    }

    function setS(campo, val, btn) {
        btn.parentNode.querySelectorAll('.btn-opcao').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        temp.semanal[campo] = val;
    }

    function salvarSemanal() {
        const dia = getDia();
        const logs = JSON.parse(localStorage.getItem('semanais_v12') || "[]");
        logs.push({ dia, dados: temp.semanal, data: new Date().toLocaleDateString() });
        localStorage.setItem('semanais_v12', JSON.stringify(logs));
        alert("Check-up concluído! Agora pode fazer o registo diário.");
        location.reload();
    }

    function salvarDiario() {
        if(!temp.periodo) return alert("Selecione o período.");
        const registro = {
            dia: getDia(),
            data: new Date().toLocaleDateString(),
            periodo: temp.periodo,
            dor: document.getElementById('input-dor').value,
            ts: Date.now()
        };
        let db = JSON.parse(localStorage.getItem('diario_v12') || "[]");
        db.unshift(registro);
        localStorage.setItem('diario_v12', JSON.stringify(db));
        alert("Salvo!");
        location.reload();
    }

    function exportarWhatsApp() {
        const db = JSON.parse(localStorage.getItem('diario_v12') || "[]");
        let txt = "*Relatório Clínico*\n\n";
        db.slice(0,10).forEach(i => txt += `Dia ${i.dia} - ${i.periodo}: Dor ${i.dor}\n`);
        window.open("https://wa.me/?text=" + encodeURIComponent(txt));
    }

    function render() {
        const ini = localStorage.getItem('inicio_v12');
        if(!ini) { document.getElementById('main-app').style.display='none'; document.getElementById('setup').style.display='block'; return; }
        
        const dia = getDia();
        document.getElementById('display-dia').innerText = "Dia " + dia;

        // LÓGICA DE BLOQUEIO 7 DIAS
        const semanais = JSON.parse(localStorage.getItem('semanais_v12') || "[]");
        const jaFezSemanal = semanais.some(s => s.dia === dia);
        
        if (dia > 0 && (dia === 1 || dia % 7 === 1)) {
            if (!jaFezSemanal) {
                document.getElementById('modal-semanal').style.display = 'block';
                document.getElementById('bloco-diario').style.opacity = '0.3';
                document.getElementById('bloco-diario').style.pointerEvents = 'none';
            }
        }

        const db = JSON.parse(localStorage.getItem('diario_v12') || "[]");
        const ctx = document.getElementById('graficoDor').getContext('2d');
        const ultimos = [...db].reverse().slice(-10);
        if(meuGrafico) meuGrafico.destroy();
        meuGrafico = new Chart(ctx, {
            type: 'line',
            data: { labels: ultimos.map(i => "D"+i.dia), datasets: [{ data: ultimos.map(i => i.dor), borderColor: '#4A6767', fill: true, tension: 0.3 }] }
        });

        const hist = document.getElementById('historico');
        db.slice(0,5).forEach(i => hist.innerHTML += `<div style="border-bottom:1px solid #eee; padding:5px; font-size:12px;">D${i.dia}: ${i.periodo} - Dor ${i.dor}</div>`);
    }

    window.onload = render;
</script>
</body>
</html>
