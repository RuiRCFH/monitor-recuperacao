<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Auto-Check | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding-bottom: 50px; }
        #visor { position: sticky; top: 0; z-index: 100; height: 260px; background: #000; border-bottom: 4px solid var(--dourado); overflow: hidden; }
        video, #foto { width: 100%; height: 100%; object-fit: cover; }
        .moldura { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 200px; border: 2px dashed var(--dourado); border-radius: 50% 50% 45% 45%; pointer-events: none; }
        .btn-snap { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: #fff; border: none; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 101; }
        .card-diag { background: #fff; border-radius: 20px; padding: 20px; margin: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid var(--azul); display: none; }
        .label-p { font-size: 0.7rem; font-weight: 800; color: var(--azul); text-transform: uppercase; margin: 15px 0 5px; display: block; }
        .btn-opt { padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd; background: #fff; font-size: 0.8rem; font-weight: 600; margin-right: 5px; margin-bottom: 5px; }
        .btn-opt.active { background: var(--azul); color: white; border-color: var(--azul); }
    </style>
</head>
<body>

    <div id="visor">
        <video id="v" autoplay playsinline></video>
        <img id="foto" style="display:none;">
        <div class="moldura"></div>
        <button class="btn-snap" onclick="snap()">📸</button>
    </div>

    <div class="container py-3">
        <h6 class="text-center fw-bold text-primary mb-3">AUTOAVALIAÇÃO BIO-ENERGÉTICA</h6>
        
        <div id="campos" style="opacity:0.4; pointer-events:none;">
            <span class="label-p">1. Cor Predominante</span>
            <div id="c-cor">
                <button class="btn-opt" onclick="sel('cor','palida',this)">Pálida</button>
                <button class="btn-opt" onclick="sel('cor','rosada',this)">Rosada</button>
                <button class="btn-opt" onclick="sel('cor','vermelha',this)">Vermelha</button>
                <button class="btn-opt" onclick="sel('cor','roxa',this)">Roxa</button>
            </div>

            <span class="label-p">2. Forma e Bordas</span>
            <div id="c-forma">
                <button class="btn-opt" onclick="sel('forma','normal',this)">Normal</button>
                <button class="btn-opt" onclick="sel('forma','inchada',this)">Inchada</button>
                <button class="btn-opt" onclick="sel('forma','marcas',this)">Marcas Dente</button>
                <button class="btn-opt" onclick="sel('forma','rachada',this)">Rachaduras</button>
                <button class="btn-opt" onclick="sel('forma','desviada',this)">Desviada</button>
            </div>

            <span class="label-p">3. Saburra (Capa)</span>
            <div id="c-sab">
                <button class="btn-opt" onclick="sel('sab','branca',this)">Branca</button>
                <button class="btn-opt" onclick="sel('sab','amarela',this)">Amarela</button>
                <button class="btn-opt" onclick="sel('sab','gordurosa',this)">Gordurosa</button>
                <button class="btn-opt" onclick="sel('sab','nenhuma',this)">Sem Capa</button>
            </div>
        </div>

        <div id="resultado" class="card-diag">
            <h5 id="r-tit" class="fw-bold mb-1">...</h5>
            <p id="r-exp" class="small text-muted mb-3">...</p>
            <div style="background:#fff9c4; padding:10px; border-radius:10px; border-left:4px solid #fbc02d;">
                <p class="small fw-bold mb-0">💡 Sugestão:</p>
                <p id="r-sug" class="small mb-0">...</p>
            </div>
            <button class="btn btn-dark btn-sm w-100 mt-3" onclick="location.reload()">Nova Análise</button>
        </div>
    </div>

    <canvas id="c" style="display:none;"></canvas>

    <script>
        let res = { cor: "", forma: "", sab: "" };
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => { document.getElementById('v').srcObject = s; });

        function snap() {
            const canvas = document.getElementById('c');
            const v = document.getElementById('v');
            canvas.width = v.videoWidth; canvas.height = v.videoHeight;
            canvas.getContext('2d').drawImage(v, 0, 0);
            document.getElementById('foto').src = canvas.toDataURL('image/png');
            v.style.display = 'none'; document.getElementById('foto').style.display = 'block';
            document.getElementById('campos').style.opacity = '1';
            document.getElementById('campos').style.pointerEvents = 'auto';
        }

        function sel(cat, val, el) {
            el.parentElement.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            res[cat] = val;
            if(res.cor && res.forma && res.sab) calc();
        }

        function calc() {
            const r = document.getElementById('resultado');
            r.style.display = 'block';
            let t = "Padrão Misto"; let e = "Sinais complexos. Recomenda-se consulta."; let s = "Avalie hábitos de sono e stress.";

            // LOGICA DE SINDROMES TÉCNICAS
            if(res.cor==='palida' && res.forma==='marcas') {
                t="Deficiência de Qi do Baço"; e="Falta de energia digestiva e acúmulo de umidade."; s="Chá de gengibre e evitar alimentos crus.";
            } else if(res.cor==='vermelha' && res.sab==='amarela') {
                t="Calor e Umidade no Fígado/Vesícula"; e="Excesso de inflamação e 'fogo' interno."; s="Chá de dente-de-leão e evitar álcool/frituras.";
            } else if(res.cor==='vermelha' && res.sab==='nenhuma') {
                t="Deficiência de Yin (Calor Vazio)"; e="Falta de lubrificação e descanso profundo."; s="Beber muita água e meditação. Evitar pimentas.";
            } else if(res.cor==='roxa') {
                t="Estase de Sangue (Xue)"; e="Bloqueio na circulação. Pode haver dor fixa."; s="Atividade física leve e compressas mornas.";
            } else if(res.forma==='desviada') {
                t="Vento Interno do Fígado"; e="Desequilíbrio profundo no sistema nervoso."; s="Repouso absoluto e controle da pressão arterial.";
            } else if(res.cor==='rosada' && res.sab==='branca') {
                t="Equilíbrio Energético"; e="Sinais de funcionalidade normal."; s="Mantenha o estilo de vida atual!";
            }

            document.getElementById('r-tit').innerText = t;
            document.getElementById('r-exp').innerText = e;
            document.getElementById('r-sug').innerText = s;
            r.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
