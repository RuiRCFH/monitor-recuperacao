<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Língua PRO | Rui Ribeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --azul: #003366; --dourado: #B8860B; --fundo: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--fundo); color: #333; }
        
        /* Área da Foto - Fixa no Topo */
        #container-foto { position: sticky; top: 0; z-index: 100; background: #000; height: 300px; overflow: hidden; border-bottom: 5px solid var(--dourado); }
        video, #preview { width: 100%; height: 100%; object-fit: cover; }
        .moldura { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 180px; height: 240px; border: 3px dashed rgba(184, 134, 11, 0.6); border-radius: 50% 50% 45% 45%; pointer-events: none; }
        
        /* Botões de Seleção Rápida */
        .secao-tecnica { padding: 20px; max-width: 500px; margin: auto; }
        .label-cat { font-size: 0.75rem; font-weight: 800; color: var(--azul); text-transform: uppercase; margin-top: 15px; display: block; letter-spacing: 1px; }
        .btn-grupo { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; }
        .btn-check { flex: 0 0 auto; padding: 10px 15px; border-radius: 12px; border: 1px solid #ddd; background: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-check.active { background: var(--azul); color: white; border-color: var(--azul); }
        
        /* Resultado Inteligente */
        #painel-diagnostico { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); margin-top: 20px; border: 2px solid var(--azul); display: none; }
